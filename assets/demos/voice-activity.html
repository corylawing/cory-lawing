<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Activity Voice Recorder · interactive demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" />
<style>
  :root{
    --bg:#0b0d12; --panel:#13161f; --panel2:#191d29; --line:#272d3c; --line2:#333a4d;
    --ink:#eef1f6; --ink2:#c7cdda; --muted:#8a93a6; --faint:#5d6577;
    --lime:#d9f77b; --lime-ink:#0a0a0a; --lime-line:rgba(217,247,123,.4);
    --teal:#3dc6ce; --amber:#f2c879; --rose:#f2778c; --violet:#b79cff; --green:#5bd08a;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100%;}
  body{background:var(--bg);color:var(--ink);
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;}
  .mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .app{max-width:1120px;margin:0 auto;padding:20px 20px 80px;}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
  h1,h2,h3{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  .muted{color:var(--muted);} .faint{color:var(--faint);}

  /* top bar */
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
  .topbar__title{font-size:18px;font-weight:700;}
  .topbar__sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .topbar__spacer{flex:1;}
  .pill{font-size:11px;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px;}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);}

  /* progress rail */
  .rail{display:flex;align-items:center;gap:0;margin-bottom:20px;flex-wrap:wrap;}
  .rstep{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--faint);}
  .rstep .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-size:11px;font-weight:700;}
  .rstep.on{color:var(--ink);} .rstep.on .n{border-color:var(--lime);color:var(--lime);}
  .rstep.done{color:var(--ink2);} .rstep.done .n{background:rgba(91,208,138,.15);border-color:var(--green);color:var(--green);}
  .rline{width:34px;height:2px;background:var(--line);margin:0 10px;border-radius:2px;}
  .rline.done{background:var(--green);}

  /* cards */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .card + .card{margin-top:16px;}
  .card__h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);}
  .card__h h3{font-size:15px;}
  .card__h .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);font-size:14px;}
  .card__b{padding:18px;}
  .grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start;}

  /* search + contact list */
  .search{position:relative;margin-bottom:12px;}
  .search input{width:100%;padding:11px 14px 11px 38px;border-radius:11px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);font-size:14px;outline:none;}
  .search input:focus{border-color:var(--lime-line);box-shadow:0 0 0 3px rgba(217,247,123,.08);}
  .search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:.5;}
  .clist{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto;}
  .citem{display:flex;align-items:center;gap:13px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;transition:.13s;}
  .citem:hover{border-color:var(--line2);transform:translateY(-1px);}
  .citem.sel{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime-line);}
  .ava{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#0a0a0a;flex-shrink:0;}
  .citem__main{flex:1;min-width:0;}
  .citem__name{font-weight:600;font-size:14px;}
  .citem__meta{font-size:12px;color:var(--muted);}
  .citem__role{font-size:11px;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:2px 9px;white-space:nowrap;}

  /* recorder */
  .rec{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px;}
  .rec__who{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 16px;margin-bottom:22px;width:100%;}
  .recbtn{width:96px;height:96px;border-radius:50%;border:none;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;position:relative;transition:.15s;box-shadow:0 12px 34px rgba(217,247,123,.25);}
  .recbtn:hover{transform:scale(1.04);}
  .recbtn.recording{background:var(--rose);box-shadow:0 0 0 0 rgba(242,119,140,.55);animation:pulse 1.6s infinite;}
  .recbtn .ic{font-size:30px;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,119,140,.5)}70%{box-shadow:0 0 0 22px rgba(242,119,140,0)}100%{box-shadow:0 0 0 0 rgba(242,119,140,0)}}
  .rec__timer{font-family:"Geist Mono",monospace;font-size:40px;font-weight:700;letter-spacing:.04em;margin:18px 0 6px;}
  .rec__hint{font-size:12.5px;color:var(--muted);max-width:340px;}
  .wave{display:flex;align-items:center;justify-content:center;gap:3px;height:40px;margin:10px 0;}
  .wave i{width:3px;height:8px;border-radius:3px;background:var(--line2);transition:height .12s;}
  .wave.live i{background:var(--lime);}
  .notes{width:100%;margin-top:18px;}
  .notes textarea{width:100%;min-height:64px;resize:vertical;background:var(--panel2);border:1px solid var(--line);border-radius:11px;color:var(--ink);padding:11px 13px;font-family:inherit;font-size:13px;outline:none;}
  .notes textarea:focus{border-color:var(--line2);}
  .notes label{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:6px;}

  /* coaching panel */
  .coach__sec{margin-bottom:18px;}
  .coach__lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:9px;display:flex;align-items:center;gap:7px;}
  .coach__lbl .tag{font-size:9px;color:var(--lime);border:1px solid var(--lime-line);border-radius:5px;padding:1px 5px;letter-spacing:.04em;}
  .chk{display:flex;align-items:flex-start;gap:9px;padding:7px 0;font-size:13px;color:var(--ink2);border-bottom:1px solid var(--line);}
  .chk:last-child{border-bottom:none;}
  .chk .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line2);flex-shrink:0;margin-top:1px;display:grid;place-items:center;transition:.2s;}
  .chk.hit .box{background:var(--green);border-color:var(--green);}
  .chk.hit{color:var(--ink);}
  .chk.miss .box{border-color:var(--rose);border-style:dashed;}
  .fieldchips{display:flex;flex-wrap:wrap;gap:7px;}
  .fchip{font-size:12px;color:var(--amber);background:rgba(242,200,121,.1);border:1px solid rgba(242,200,121,.3);border-radius:999px;padding:4px 11px;display:inline-flex;align-items:center;gap:6px;transition:.2s;}
  .fchip.filled{color:var(--green);background:rgba(91,208,138,.12);border-color:rgba(91,208,138,.4);}
  .fchip .x{opacity:.7;}

  /* processing */
  .proc{padding:40px 18px;text-align:center;}
  .proc__ring{width:74px;height:74px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--lime);margin:0 auto 22px;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .proc__steps{max-width:340px;margin:0 auto;text-align:left;}
  .proc__step{display:flex;align-items:center;gap:11px;padding:9px 0;color:var(--faint);font-size:13.5px;transition:.25s;}
  .proc__step.on{color:var(--ink);}
  .proc__step.done{color:var(--ink2);}
  .proc__step .d{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;display:grid;place-items:center;font-size:10px;}
  .proc__step.done .d{background:var(--green);border-color:var(--green);color:#0a0a0a;}
  .proc__step.on .d{border-color:var(--lime);}

  /* results */
  .scorebar{display:flex;gap:14px;flex-wrap:wrap;}
  .score{flex:1;min-width:180px;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:14px 16px;}
  .score__top{display:flex;align-items:baseline;justify-content:space-between;}
  .score__lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);}
  .score__val{font-size:26px;font-weight:800;font-family:"Geist Mono",monospace;}
  .score__bar{height:6px;border-radius:4px;background:var(--line);margin:10px 0 8px;overflow:hidden;}
  .score__fill{height:100%;border-radius:4px;}
  .score__tip{font-size:12px;color:var(--ink2);display:flex;gap:7px;align-items:flex-start;}
  .transcript{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--ink2);line-height:1.6;}
  .transcript .cur{border-right:2px solid var(--lime);animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0}}

  .kv{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);min-width:150px;flex-shrink:0;}
  .kv .v{font-weight:600;}
  .tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
  .tg2{font-size:11.5px;border-radius:999px;padding:3px 11px;font-weight:600;}
  .tg2--type{background:rgba(61,198,206,.14);color:var(--teal);border:1px solid rgba(61,198,206,.34);}
  .tg2--pur{background:rgba(183,156,255,.14);color:var(--violet);border:1px solid rgba(183,156,255,.34);}
  .tg2--out{background:rgba(217,247,123,.13);color:var(--lime);border:1px solid var(--lime-line);}
  .desc{font-size:13.5px;color:var(--ink2);line-height:1.6;white-space:pre-wrap;}

  .upd{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line);}
  .upd:last-child{border-bottom:none;}
  .upd .ck{width:20px;height:20px;border-radius:6px;background:rgba(91,208,138,.16);border:1px solid var(--green);display:grid;place-items:center;flex-shrink:0;}
  .upd__f{flex:1;min-width:0;}
  .upd__name{font-size:13.5px;font-weight:600;}
  .upd__chg{font-size:12.5px;color:var(--muted);}
  .upd__chg b{color:var(--ink2);}
  .arrow{color:var(--faint);margin:0 6px;}

  .task{display:flex;gap:13px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .task .cal{width:46px;height:46px;border-radius:10px;background:var(--bg);border:1px solid var(--line2);display:grid;place-items:center;text-align:center;flex-shrink:0;line-height:1;}
  .task .cal .m{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--rose);}
  .task .cal .d{font-size:18px;font-weight:800;}

  /* opportunity pipeline */
  .pipe{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:6px 0 14px;}
  .pstage{font-size:11.5px;padding:6px 12px;border-radius:8px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;}
  .pstage.cur{background:var(--panel2);color:var(--ink2);border-color:var(--line2);}
  .pstage.to{background:rgba(217,247,123,.13);color:var(--lime);border-color:var(--lime);font-weight:700;animation:glow 1.8s ease-in-out infinite;}
  .pstage.passed{color:var(--faint);}
  @keyframes glow{50%{box-shadow:0 0 0 4px rgba(217,247,123,.12)}}
  .parr{color:var(--faint);margin:0 7px;font-size:12px;}
  .reco{display:flex;gap:11px;align-items:flex-start;background:rgba(217,247,123,.06);border:1px solid var(--lime-line);border-radius:12px;padding:13px 15px;}

  /* email */
  .email{background:var(--panel2);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .email__row{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13px;align-items:center;}
  .email__row .lab{color:var(--muted);min-width:54px;}
  .email__row input{flex:1;background:transparent;border:none;color:var(--ink);font-size:13.5px;outline:none;font-family:inherit;}
  .email__body{width:100%;min-height:184px;resize:vertical;background:transparent;border:none;color:var(--ink2);padding:14px;font-family:inherit;font-size:13.5px;line-height:1.62;outline:none;}

  .btn{font-size:13.5px;font-weight:600;border-radius:11px;padding:11px 18px;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;transition:.14s;}
  .btn--lime{background:var(--lime);color:var(--lime-ink);}
  .btn--lime:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .btn--lime:disabled{opacity:.4;cursor:not-allowed;transform:none;}
  .btn--ghost{background:transparent;border-color:var(--line2);color:var(--ink2);}
  .btn--ghost:hover{border-color:var(--faint);color:var(--ink);}
  .btn--rose{background:var(--rose);color:#0a0a0a;}
  .btn--rose:hover{filter:brightness(1.05);}
  .btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--lime);color:var(--lime-ink);padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:90;box-shadow:0 14px 36px rgba(0,0,0,.5);}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .fade{animation:fade .3s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  @media(max-width:780px){ .grid2{grid-template-columns:1fr;} .rec__who{flex-wrap:wrap;} }
  .email__row{min-height:44px;padding:0 14px;}
  .email__row input{padding:12px 0;min-width:0;}

  /* ===== upgrade: viewport shell ===== */
  html,body{height:100%;overflow:hidden;}
  .vp{height:100vh;height:100dvh;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
  .grid2 > .card + .card, .grid2 > div > .card + .card{margin-top:0;}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0;}
  .grid2 > *{min-width:0;}
  .btn{min-height:42px;}
  .btn--sm{font-size:12.5px;padding:8px 13px;border-radius:10px;}
  .btn:focus-visible,.citem:focus-visible,.tabbtn:focus-visible,.prop:focus-within{outline:2px solid var(--lime);outline-offset:2px;}
  .topbtn{min-height:40px;font-size:12px;color:var(--ink2);border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 13px;display:inline-flex;align-items:center;gap:7px;}
  .topbtn:hover{border-color:var(--faint);color:var(--ink);}
  .topbtn .cnt{font-family:"Geist Mono",monospace;font-size:11px;background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:0 7px;color:var(--lime);}
  .card__h .sp{margin-left:auto;}
  .note{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .demo-note{display:flex;gap:9px;align-items:flex-start;font-size:12px;color:var(--ink2);background:rgba(61,198,206,.07);border:1px solid rgba(61,198,206,.28);border-radius:11px;padding:9px 12px;}
  .demo-note b{color:var(--teal);font-weight:600;}
  .empty{padding:18px 12px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line2);border-radius:12px;}

  /* today's meetings */
  .meets{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;}
  .meet{display:flex;flex-direction:column;gap:8px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);min-width:0;}
  .meet__time{font-family:"Geist Mono",monospace;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px;}
  .meet__time .live{width:7px;height:7px;border-radius:50%;background:var(--green);}
  .meet__time .soon{width:7px;height:7px;border-radius:50%;background:var(--amber);}
  .meet__title{font-weight:600;font-size:13.5px;}
  .meet__who{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);min-width:0;}
  .meet__who .ava{width:26px;height:26px;font-size:10.5px;}
  .meet__who span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .meet .btn{justify-content:center;margin-top:auto;}
  .meet.done{border-color:rgba(91,208,138,.35);}
  .why{font-size:11.5px;color:var(--faint);}

  /* history */
  .hist{display:flex;flex-direction:column;gap:8px;}
  .hitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);text-align:left;color:var(--ink);width:100%;min-height:52px;}
  .hitem:hover{border-color:var(--line2);}
  .hitem .ava{width:32px;height:32px;font-size:12px;}
  .hitem__m{flex:1;min-width:0;}
  .hitem__t{font-weight:600;font-size:13px;}
  .hitem__s{font-size:11.5px;color:var(--muted);}
  .st{font-size:10.5px;border-radius:999px;padding:2px 9px;white-space:nowrap;border:1px solid var(--line2);color:var(--ink2);}
  .st--ok{color:var(--green);border-color:rgba(91,208,138,.4);background:rgba(91,208,138,.1);}
  .st--wait{color:var(--amber);border-color:rgba(242,200,121,.35);background:rgba(242,200,121,.08);}
  .drawer-bg{position:fixed;inset:0;background:rgba(5,6,9,.6);z-index:70;opacity:0;pointer-events:none;transition:.2s;}
  .drawer-bg.show{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:71;transform:translateX(102%);transition:transform .25s ease;display:flex;flex-direction:column;}
  .drawer.show{transform:none;}
  .drawer__h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);}
  .drawer__h h3{font-size:15px;flex:1;}
  .drawer__b{padding:16px;overflow:auto;flex:1;}
  .xbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--ink2);font-size:18px;}

  /* record mode tabs + typed debrief */
  .tabs{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);margin-bottom:18px;width:100%;}
  .tabbtn{flex:1;min-height:40px;border:none;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;font-weight:600;}
  .tabbtn.on{background:var(--bg);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);}
  .typed{width:100%;text-align:left;}
  .typed textarea{width:100%;min-height:220px;resize:vertical;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;color:var(--ink);padding:13px 14px;font-family:inherit;font-size:13.5px;line-height:1.6;outline:none;}
  .typed textarea:focus{border-color:var(--lime-line);box-shadow:0 0 0 3px rgba(217,247,123,.08);}
  .typed__bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0 12px;}
  .typed__count{font-size:11.5px;color:var(--faint);margin-left:auto;font-family:"Geist Mono",monospace;}
  .found{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;min-height:24px;}
  .found .tg2{font-weight:500;}
  .tg2--risk{background:rgba(242,119,140,.12);color:var(--rose);border:1px solid rgba(242,119,140,.34);}
  .tg2--amber{background:rgba(242,200,121,.1);color:var(--amber);border:1px solid rgba(242,200,121,.32);}
  .disabled-why{font-size:12px;color:var(--faint);}

  /* transcript with sources */
  .transcript .s{border-radius:4px;transition:background .2s,box-shadow .2s;}
  .transcript .s.src{background:rgba(217,247,123,.06);box-shadow:inset 0 -1px 0 var(--lime-line);}
  .transcript .s.on{background:rgba(217,247,123,.2);box-shadow:0 0 0 2px rgba(217,247,123,.22);color:var(--ink);}
  .transcript .notehd{display:block;margin-top:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);}

<script>
/* =========================================================
   Demo parser. Fixed rules stand in for the language model
   used in production. It reads typed debriefs and written
   notes, and returns findings tied to the sentence they
   came from, each with a confidence score.
   ========================================================= */
const DOWS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MONS=['january','february','march','april','may','june','july','august','september','october','november','december'];
const NUMW={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,fifteen:15,twenty:20,thirty:30};
const VAGUE=/^(a few|several|a couple of|a couple|some|multiple|many)$/;
const COMP_KNOWN=['Pipewell','Northwind CRM','Clearpath','Vantage CRM','Orbitly','Stackline','Brightlane'];
const STOPW=new Set('So I We They He She It The This That Their Our My Good Great Really Next Budget Just Also Then Right Today Tomorrow Monday Tuesday Wednesday Thursday Friday Saturday Sunday January February March April May June July August September October November December Q1 Q2 Q3 Q4 ROI CRM VP IT CEO CFO CTO CIO COO Head Chief Overall Pricing Legal Security Plus Need Agreed Action Written Note Met Had Spoke Quick Call Meeting Follow Both Everyone Nobody Not No Yes Thanks Sounds Big Main Key Excel After Before When If Once Pretty Very Positive Overall Everything Nothing Lots Most Some One Two Three Four Five'.split(' '));
const TITLE_RE='(chief [a-z]+ officer|ceo|cfo|cto|cio|coo|cro|cmo|vp(?: of)? [a-z]+(?: [a-z]+)?|vice president(?: of)? [a-z]+|head of [a-z]+(?: [a-z]+)?|(?:it |finance |procurement |operations |sales |marketing |engineering )?director(?: of [a-z]+)?|(?:procurement|finance|it|ops|operations|project|program|product|security|engineering) (?:lead|manager)|controller|founder|owner|general counsel|legal counsel|champion|economic buyer|decision[- ]maker|exec(?:utive)? sponsor|sponsor|budget holder)';
const TASKVERB=/^(send|share|book|schedule|set up|arrange|call|email|draft|prepare|introduce|loop in|invite|demo|review|check|chase|forward|organi[sz]e|plan|build|put together|pull together|provide|deliver|submit|run|host|line up|map|reply|reconvene|meet|present|walk|price|quote|follow up|get|write|confirm|update|create|ask|talk|speak|reach out|connect)\b/;

function d0(d){const x=new Date(d);x.setHours(0,0,0,0);return x;}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function monthEnd(y,m){return new Date(y,m+1,0);}
function fmtD(d){return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function cap1(s){s=String(s||'').trim();return s?s[0].toUpperCase()+s.slice(1):s;}
function tidy(s){return String(s).replace(/\s+/g,' ').replace(/^[\s,;:.\-]+|[\s,;:.\-]+$/g,'');}
function numOf(w){w=String(w).toLowerCase().replace(/,/g,'');if(/^\d+$/.test(w))return +w;return NUMW[w]||0;}
function money(n){return '$'+Math.round(n).toLocaleString('en-US');}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function splitSentences(text){
  const out=[];
  String(text||'').split(/\n+/).forEach(par=>{
    par.replace(/\s+/g,' ').trim().split(/(?<=[.!?])\s+(?=["'(]?[A-Z0-9])/).forEach(s=>{ s=s.trim(); if(s) out.push(s); });
  });
  return out;
}

/* every date phrase in a lower-cased sentence */
function findDates(low,today){
  const out=[];let m,re;
  const add=(mm,date,soft)=>{ if(date) out.push({i:mm.index,len:mm[0].length,phrase:tidy(mm[0]),date:d0(date),soft:!!soft}); };
  re=/\b(?:by |on |before )?(?:end of (?:the )?day|eod|today|tonight)\b/g; while((m=re.exec(low))) add(m,today);
  re=/\b(?:by |on |before )?tomorrow\b/g; while((m=re.exec(low))) add(m,addD(today,1));
  re=/\b(?:by |on |before |this |next |early next )*(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/g;
  while((m=re.exec(low))){ let diff=(DOWS.indexOf(m[1])-today.getDay()+7)%7; if(diff===0) diff=7; if(/next /.test(m[0])&&diff<3) diff+=7; add(m,addD(today,diff)); }
  re=/\b(?:by |before )?(?:the )?end of (?:the |this )?week\b|\beow\b/g; while((m=re.exec(low))){ let f=(5-today.getDay()+7)%7; if(f===0)f=7; add(m,addD(today,f)); }
  re=/\b(?:early |late |sometime )?next week\b/g; while((m=re.exec(low))) add(m,addD(today,7),true);
  re=/\b(?:later )?this week\b/g; while((m=re.exec(low))){ let f=(5-today.getDay()+7)%7; add(m,addD(today,f||1),true); }
  re=/\b(?:in|within) (\d+|one|two|three|four|five|six|a couple of|a few) (days?|weeks?|months?)\b/g;
  while((m=re.exec(low))){ const n=/couple/.test(m[1])?2:/few/.test(m[1])?3:numOf(m[1]); const d=new Date(today); if(/month/.test(m[2])) d.setMonth(d.getMonth()+n); else d.setDate(d.getDate()+n*(/week/.test(m[2])?7:1)); add(m,d,/few|couple/.test(m[1])); }
  re=/\b(?:by |before )?(?:the )?end of (?:the |this )?month\b/g; while((m=re.exec(low))) add(m,monthEnd(today.getFullYear(),today.getMonth()));
  re=/\bnext month\b/g; while((m=re.exec(low))) add(m,new Date(today.getFullYear(),today.getMonth()+1,15),true);
  re=/\b(?:by |before )?(?:the )?(?:end of (?:the |this )?quarter|this quarter)\b/g;
  while((m=re.exec(low))){ const q=Math.floor(today.getMonth()/3); add(m,monthEnd(today.getFullYear(),q*3+2),/this quarter/.test(m[0])&&!/end/.test(m[0])); }
  re=/\bnext quarter\b/g; while((m=re.exec(low))){ const q=Math.floor(today.getMonth()/3)+1; add(m,monthEnd(today.getFullYear()+Math.floor(q/4),(q%4)*3+2),true); }
  re=/\b(?:by |in |before )?q([1-4])\b/g; while((m=re.exec(low))){ const q=+m[1]-1; let d=monthEnd(today.getFullYear(),q*3+2); if(d<today) d=monthEnd(today.getFullYear()+1,q*3+2); add(m,d,true); }
  const MON_RE='(jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t(?:ember)?)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
  re=new RegExp('\\b(?:by |on |before |in |until )?(?:(early|mid|late|the end of|end of) )?'+MON_RE+'\\b(?: (\\d{1,2})(?:st|nd|rd|th)?)?','g');
  while((m=re.exec(low))){
    if(m[2]==='may'&&!m[3]&&!/\b(?:in|by|before|until|early|mid|late|end of) may/.test(m[0])) continue;
    const mi=MONS.findIndex(x=>x.slice(0,3)===m[2].slice(0,3)); const q=m[1]||'';
    const day=m[3]?+m[3]:/mid/.test(q)?15:/early/.test(q)?5:/late/.test(q)?25:monthEnd(today.getFullYear(),mi).getDate();
    let d=new Date(today.getFullYear(),mi,Math.min(day,monthEnd(today.getFullYear(),mi).getDate())); if(d<today) d=new Date(today.getFullYear()+1,mi,Math.min(day,monthEnd(today.getFullYear()+1,mi).getDate()));
    add(m,d,!m[3]&&!/end/.test(q));
  }
  re=new RegExp('\\b(?:on |by |before )?(?:the )?(\\d{1,2})(?:st|nd|rd|th)? (?:of )?'+MON_RE+'\\b','g');
  while((m=re.exec(low))){ const mi=MONS.findIndex(x=>x.slice(0,3)===m[2].slice(0,3)); let d=new Date(today.getFullYear(),mi,+m[1]); if(d<today) d=new Date(today.getFullYear()+1,mi,+m[1]); add(m,d); }
  out.sort((a,b)=>a.i-b.i||b.len-a.len);
  const kept=[];let end=-1; out.forEach(d=>{ if(d.i>=end){kept.push(d);end=d.i+d.len;} });
  return kept;
}

function roleFor(t){
  t=t.toLowerCase()+' ';
  if(/ceo|cfo|coo|founder|owner|economic buyer|budget holder|chief (?:executive|financial|operating)/.test(t)) return 'Economic buyer';
  if(/decision/.test(t)) return 'Decision maker';
  if(/champion|sponsor/.test(t)) return 'Champion';
  if(/cto|cio|it |security|engineering|technical/.test(t)) return 'Technical evaluator';
  if(/procurement|counsel|legal/.test(t)) return 'Procurement';
  return 'Influencer';
}
function titleCase(t){ return t.replace(/\b([a-z])/g,c=>c.toUpperCase()).replace(/\b(Ceo|Cfo|Cto|Cio|Coo|Cro|Cmo|Vp|It)\b/g,x=>x.toUpperCase()).replace(/\bOf\b/g,'of'); }
const DM_T=/decision|economic buyer|budget holder|ceo|cfo|coo|founder|owner/;

function parseDebrief(text,c,today){
  today=d0(today||new Date());
  const sents=splitSentences(text);
  const R={sents,tasks:[],roles:[],comps:[],risks:[],pains:[],dates:[],cover:{},fields:{},budget:null,amount:null,signals:[],hold:null,mentions:[],words:(String(text).match(/\S+/g)||[]).length};
  const first=c.name.split(' ')[0];
  const cov=(k,s,phrase)=>{ if(!R.cover[k]) R.cover[k]={s,phrase:tidy(phrase)}; };
  const fld=(key,to,s,phrase,conf,why)=>{ if(!R.fields[key]) R.fields[key]={to,s,phrase:tidy(phrase),conf,why:why||''}; };
  const sig=(k,t,s,phrase)=>{ if(!R.signals.some(x=>x.k===k)) R.signals.push({k,t,s,phrase:tidy(phrase)}); };
  CONTACTS.forEach(o=>{ if(o.id!==c.id && (text.includes(o.name)||text.includes(o.account))) R.mentions.push(o); });

  sents.forEach((sent,si)=>{
    const low=sent.toLowerCase(); let m;
    const dates=findDates(low,today); dates.forEach(d=>R.dates.push(Object.assign({s:si},d))); if(dates.length) cov('time',si,dates[0].phrase);

    /* sites and users */
    if((m=low.match(/\b(\d+|one|two|three|four|five|six|seven|eight|nine|ten|twelve|twenty|a few|several|a couple of|a couple|multiple)\s+(?:more\s+|new\s+|additional\s+|other\s+|of (?:their|our) )?(sites|locations|offices|plants|warehouses|branches|stores|countries|regions|depots)\b/))){
      const vague=VAGUE.test(m[1]); const n=vague?'3+':String(numOf(m[1]));
      fld('Number of sites',n,si,m[0],vague?62:90,vague?'Vague wording ("'+m[1]+'"). Check the exact number.':'');
    }
    if((m=low.match(/\b(about |around |roughly |~|over |nearly |almost )?(\d[\d,]*)\s+(?:active\s+|named\s+|daily\s+|licensed\s+)?(users|seats|licen[cs]es|reps|agents)\b/))){
      fld('Active users',m[2].replace(/,/g,''),si,m[0],m[1]?82:91,'');
    }
    /* tooling, incumbent, competitors */
    if((m=sent.match(/\b(?:currently|right now|today|still)\b[^.]*?\b(?:on|using|use|running|in|with)\s+(?:a |an |the |their )?((?:legacy |old |homegrown |home-grown |in-house |custom |manual |shared )*(?:in-house tool|spreadsheets?|Excel|[A-Z][\w-]+(?: [A-Z][\w-]+)?))/))||(m=sent.match(/\b(?:moving|move|switching|migrating) (?:off|away from|from)\s+(?:a |an |the |their )?((?:legacy |old |homegrown |in-house )*(?:in-house tool|spreadsheets?|Excel|[A-Z][\w-]+(?: [A-Z][\w-]+)?))/))){
      if(!STOPW.has(m[1].split(' ')[0]) && m[1]!==c.account){ fld('Current tooling',cap1(m[1]),si,m[0],86,''); cov('comp',si,m[0]); }
    }
    const compRe=/\b(?:also (?:looking at|talking to|evaluating|considering|speaking with)|evaluating|comparing (?:us )?(?:with|to|against)|competing (?:with|against)|up against|incumbent is|a (?:quote|bid|proposal|demo|pitch) from|leaning towards|shortlisted|went with|chose)\s+((?:[A-Z][\w&.-]*)(?: [A-Z][\w&.-]*)?)/g;
    while((m=compRe.exec(sent))){ const nm=m[1].replace(/[.,]$/,''); if(!STOPW.has(nm.split(' ')[0]) && nm!==c.account && !R.comps.some(x=>x.name===nm)){ R.comps.push({name:nm,s:si,phrase:m[0],conf:/went with|chose|incumbent/.test(m[0])?88:80}); cov('comp',si,m[0]); } }
    COMP_KNOWN.forEach(nm=>{ const short=nm.split(' ')[0]; if(sent.indexOf(short)>=0 && !R.comps.some(x=>x.name.split(' ')[0]===short)){ R.comps.push({name:nm,s:si,phrase:sent.indexOf(nm)>=0?nm:short,conf:84}); cov('comp',si,short); } });
    if((m=low.match(/\b(?:went with|chose|signed with|not moving forward|lost (?:it|the deal)|no longer interested)\b/))) R.hold=R.hold||{t:'Buyer chose another option or stopped',s:si,phrase:m[0]};

    /* people and roles */
    const nameRe=/\b([A-Z][a-z]+(?:[ -][A-Z][a-z'’-]+)?)\b/g;
    while((m=nameRe.exec(sent))){
      let nm=m[1]; if(STOPW.has(nm.split(/[ -]/)[0])) continue;
      if(CONTACTS.some(o=>o.account===nm||o.account.startsWith(nm+' ')) || c.account.includes(nm) || R.comps.some(x=>x.name.split(' ')[0]===nm.split(' ')[0]) || COMP_KNOWN.some(x=>x.startsWith(nm))) continue;
      const st=m.index,en=st+nm.length;
      const after=low.slice(en,en+60), before=low.slice(Math.max(0,st-45),st);
      let t=null,ph='';
      const a=after.match(new RegExp('^\\s*(?:\\(|,\\s*|\\s+is\\s+|\\s+who\\s+is\\s+|\\s+who\'s\\s+|\\s*-\\s*|\\s+as\\s+)(?:the |their |our |a |an |basically the |actually the |also the |clearly the |now the )?'+TITLE_RE+'\\b'));
      if(a){t=a[1];ph=sent.slice(st,en+a[0].length);}
      else { const b=before.match(new RegExp('\\b(?:the |their |our )?'+TITLE_RE+'(?:,\\s*|\\s+)$')); if(b){t=b[1];ph=sent.slice(st-b[0].length,en);} }
      const so=after.match(/^\s+(?:signs off|has (?:the )?final say|holds the budget|owns the budget|makes the call)/);
      if(!t && so){ t='decision maker'; ph=sent.slice(st,en)+so[0]; }
      const isContact=(nm===c.name||nm===first||c.name.startsWith(nm+' '));
      if(!t){ if(!isContact && /^[A-Z][a-z]+ [A-Z][a-z]+$/.test(nm) && !R.roles.some(r=>r.name===nm)) R.roles.push({name:nm,title:'',role:'Influencer',s:si,phrase:nm,conf:58}); continue; }
      const role=roleFor(t), roleOnly=/champion|economic buyer|decision|sponsor|budget holder/.test(t);
      if(DM_T.test(t)){ cov('dm',si,ph); sig('dm','Decision-maker engaged',si,ph); }
      if(isContact){
        if(!roleOnly) fld('Job title',titleCase(t),si,ph,90,'');
        if(DM_T.test(t)) fld('Decision maker',c.name,si,ph,88,'');
      } else {
        const ex=R.roles.find(r=>r.name===nm||r.name.startsWith(nm+' ')||nm.startsWith(r.name+' '));
        const rec={name:ex&&ex.name.length>nm.length?ex.name:nm,title:roleOnly?(ex&&ex.title||''):titleCase(t),role,s:si,phrase:ph,conf:roleOnly?78:86};
        if(ex) Object.assign(ex,rec); else R.roles.push(rec);
        if(role==='Economic buyer'||role==='Decision maker') fld('Decision maker',rec.name+(rec.title?' ('+rec.title+')':''),si,ph,role==='Decision maker'?84:76,'');
      }
    }
    if((m=low.match(/\b(?:decision[- ]maker|economic buyer|signs? off|final say|budget holder|exec(?:utive)? sponsor)\b/))) cov('dm',si,m[0]);

    /* budget and amount */
    if((m=low.match(/budget(?:'s| is| has been| was| got)? (?:now )?(?:approved|signed off|confirmed|allocated|in place|secured|agreed)|(?:approved|signed off on|confirmed|secured|allocated) (?:the |a |their )?budget|(?:they |we )have (?:the )?budget/))){ R.budget={to:'Approved',s:si,phrase:m[0],conf:92}; sig('budget','Budget confirmed',si,m[0]); cov('time',si,m[0]); }
    else if((m=low.match(/no budget|budget (?:isn't|is not|is not yet|not yet|hasn't been|has not been) (?:approved|confirmed|signed off|allocated)|budget (?:freeze|cut|is frozen)|need(?:s)? to find (?:the )?budget/))){ R.budget={to:'Not secured',s:si,phrase:m[0],conf:86}; cov('time',si,m[0]); }
    else if((m=low.match(/budget (?:needs|is pending|pending|awaiting|waiting on|goes to) [a-z ]{0,20}(?:approval|sign[- ]off|board|committee)|waiting on budget/))){ R.budget={to:'Pending approval',s:si,phrase:m[0],conf:80}; cov('time',si,m[0]); }
    if((!R.amount || R.amount.conf<80) && (m=sent.match(/(?:[$€£]\s?\d[\d,.]*\s?(?:k|m|million|thousand)?\b|\b\d[\d,.]*\s?(?:k|m|million|thousand)?\s?(?:dollars|euros|usd|eur|gbp)\b|\b\d[\d,.]*k\b)/i)) && /budget|price|pricing|deal|contract|quote|spend|amount|cost|worth|value|annual|per year|a year|[$€£]/i.test(sent)){
      let raw=m[0].toLowerCase().replace(/[$€£,\s]|dollars|euros|usd|eur|gbp/g,''); let mult=1;
      if(/(k|thousand)$/.test(raw)){mult=1000;raw=raw.replace(/(k|thousand)$/,'');} else if(/(m|million)$/.test(raw)){mult=1e6;raw=raw.replace(/(m|million)$/,'');}
      const n=parseFloat(raw)*mult, ac=(/budget|contract|deal|annual|per year|a year/.test(low)?86:72)-(/anything (?:over|above)|threshold|limit|over \$/.test(low)?14:0);
      if(n>=500 && (!R.amount||ac>R.amount.conf)){ R.amount={to:n,s:si,phrase:m[0],conf:ac}; cov('time',si,m[0]); }
      if(n>=500 && !R.budget && /\bbudget\b/.test(low) && !/anything (?:over|above)/.test(low)) R.budget={to:'Identified',s:si,phrase:m[0],conf:74};
    }
    /* renewal and close dates */
    if(/\brenew/.test(low) && dates.length){ const d=dates.find(x=>x.i>low.indexOf('renew'))||dates[0]; fld('Renewal date',fmtD(d.date),si,d.phrase,d.soft?66:82,d.soft?'Month only. The exact day is a guess.':''); }
    if(/\b(?:sign|signature|signed|close|closing|decision|contract|go[- ]live|start date|kick ?off)\b/.test(low) && !/\brenew/.test(low) && dates.length){ const d=dates[dates.length-1]; fld('Close date',fmtD(d.date),si,sent.slice(Math.max(0,d.i-24),d.i+d.len),d.soft?64:78,d.soft?'Approximate date. Check it before writing.':''); }

    /* pains and ROI */
    if((m=low.match(/\b(pain|frustrat\w*|struggl\w*|manual(?:ly)?|spreadsheets?|problem|challenge|too slow|errors?|no (?:single )?(?:view|visibility)|takes? (?:hours|days|forever)|wast\w+|bottlenecks?|chasing|headache)\b/))){ cov('pain',si,m[0]); R.pains.push({s:si,phrase:m[0],t:sent}); }
    if((m=sent.match(/\d+\s?%|\bROI\b|\bpayback\b|\bsav(?:e|es|ed|ing)\s+(?:about |around |over |roughly )?(?:\d|[$€£])|\bhours (?:a|per) (?:week|month)|\bcut [a-z ]{0,20}by (?:half|\d)/i))) cov('roi',si,m[0]);

    /* risks */
    const RISKS=[
      [/\b(?:security review|infosec|security questionnaire|soc ?2|gdpr|dpa|pen ?test)\b/,'Security review'],
      [/\b(?:legal review|legal|redlines?|contract review|msa)\b/,'Legal review'],
      [/\b(?:too expensive|price is (?:too )?high|pricing (?:is )?(?:a )?(?:concern|issue|sticking point|problem)|over budget|cheaper|discount)\b/,'Price pushback'],
      [/\b(?:budget freeze|budget cut|budget is frozen|no budget|budget (?:isn't|is not|not yet) (?:approved|confirmed))\b/,'Budget not secured'],
      [/\b(?:on hold|paused|delay(?:ed|s)?|push(?:ed)? (?:it )?back|slip(?:ped|s)?|reorg|re-org|layoffs?|restructur\w*|hiring freeze)\b/,'Timeline risk'],
      [/\b(?:churn|cancel\w*|not renew|won't renew|leaving)\b/,'Churn risk'],
      [/\b(?:concern(?:ed|s)?|worried|worry|nervous|hesitant|skeptical|sceptical|pushback|unsure|not convinced)\b/,'Concern raised'],
      [/\b(?:blocker|blocking|risk)\b/,'Risk flagged']
    ];
    if(!/\bno (?:real )?(?:risks?|concerns?|blockers?)\b/.test(low)) for(const [re,label] of RISKS){ const mm=low.match(re); if(mm){ R.risks.push({label,note:sent.length>110?sent.slice(0,107)+'…':sent,s:si,phrase:mm[0],conf:label==='Risk flagged'?66:76}); break; } }
    if((m=low.match(/\b(?:on hold|paused|no longer|not moving forward)\b/))) R.hold=R.hold||{t:'Deal paused',s:si,phrase:m[0]};

    /* stage signals */
    if((m=low.match(/\b(?:proposal|quote|pricing|order form|sow|statement of work)\b/)) && /\b(?:send|share|prepare|put together|draft|want|asked for|requested|need)\b/.test(low)) sig('proposal','Proposal or pricing requested',si,m[0]);
    if((m=low.match(/\b(?:redlines?|negotiat\w*|commercial terms|contract terms|procurement)\b/))) sig('terms','Commercial terms in discussion',si,m[0]);
    if((m=low.match(/\b(?:verbal (?:yes|commit\w*)|green light|go ahead|ready to sign)\b/))) sig('commit','Verbal commitment',si,m[0]);
    if((m=low.match(/\b(?:signed|countersigned)\b/)) && /\b(?:contract|order form|deal|agreement)\b/.test(low) && !/\bnot\b|n't/.test(low)) sig('signed','Contract signed',si,m[0]);

    /* next steps */
    const trig=low.match(/\b(?:i'll|i will|i'm going to|i am going to|i need to|i promised to|i owe (?:them|him|her)|we agreed (?:that )?(?:i'll |i will |i'd |to )?|the next step is (?:for me )?(?:to )?|next steps? (?:is|are|:)\s*(?:for me )?(?:to )?|action items?:?\s*|we'll|we will|let's|they'll|they will|she'll|she will|he'll|he will)\s*/);
    if(trig){
      const rest=sent.slice(trig.index+trig[0].length).replace(/^(?:for me to|to|then)\s+/i,'');
      const parts=rest.split(/,\s*(?:and\s+)?then\s+|;\s*(?:and\s+)?(?:then\s+)?|\s+and then\s+|,\s+and\s+(?=(?:send|book|schedule|set up|share|loop in|introduce|get)\b)/i);
      parts.forEach((p,pi)=>{
        let t=tidy(p.replace(/\s+(?:so|because|since|as)\s.*$/i,'').replace(/[.!?]+$/,''));
        const pd=findDates(t.toLowerCase(),today);
        pd.slice().reverse().forEach(d=>{ t=tidy(t.slice(0,d.i)+t.slice(d.i+d.len)); });
        t=t.replace(/\s+(?:by|on|for|before|in)$/i,'');
        if(t.length<6) return;
        const tl=t.toLowerCase(), verb=TASKVERB.test(tl), owner=/^(?:they|she|he)/.test(trig[0].trim())?'them':'you';
        const d=pd[0]||(pi===parts.length-1?dates.find(x=>x.i>=trig.index):null)||null;
        const meeting=(/^(?:book|schedule|set up|arrange|hold|host|run)\b/.test(tl)&&/\b(?:call|meeting|follow-?up|demo|session|workshop|review|catch[- ]up)\b/.test(tl))||/^(?:meet|reconvene)\b/.test(tl);
        let conf=72+(verb?10:-8)+(d&&!d.soft?8:d?-6:-12)+(pi>0?-4:0)+(owner==='them'?-6:0); conf=Math.max(48,Math.min(95,conf));
        R.tasks.push({title:cap1(t.length>70?t.slice(0,67)+'…':t),due:d?d.date:addD(today,7),s:si,phrase:t,conf,meeting,owner,
          why:!d?'No date given. Due date set to 7 days out.':(d.soft?'Rough timing ("'+d.phrase+'"). Day picked for you.':'')});
        cov('next',si,t);
      });
    }
  });

  /* stage recommendation */
  const sc=R.signals.length;
  let to=c.stage;
  if(R.signals.some(x=>x.k==='signed')) to=4;
  else if(sc>=2||(sc===1&&R.signals[0].k!=='dm'&&R.tasks.length)) to=Math.min(c.stage+1,STAGES.length-1);
  if(R.signals.some(x=>x.k==='terms'||x.k==='commit')&&to<3&&c.stage>=1) to=Math.min(3,c.stage+2);
  if(R.hold) to=c.stage;
  R.stage={from:c.stage,to,conf:Math.min(94,58+sc*12),hold:R.hold};
  return R;
}

/* turn parser output into proposals, offset into the debrief's sentence list */
function itemsFromParse(R,c,r,off,typed){

function actType(R){ const all=R.sents.join(' ').toLowerCase(); return /\b(?:call|phone|rang|zoom)\b/.test(all)&&!/\b(?:meeting|met)\b/.test(all)?'Call':'Meeting'; }
function actSubject(R,c,meeting){

  [[/pric|quote|proposal|discount/,'Pricing'],[/rollout|roll-out|implementation|onboard|go-live|go live/,'Rollout'],[/renew/,'Renewal'],[/security|infosec|soc ?2|gdpr/,'Security'],[/demo/,'Demo'],[/contract|legal|redline/,'Contract'],[/budget/,'Budget']].forEach(([re,t])=>{ if(re.test(all)&&tp.length<2) tp.push(t); });

function buildDebrief(source){
  const c=state.contact, r=crmFor(c);
  const deb={id:'d'+(++DEB_N),c,meeting:state.meeting,source,created:new Date(),before:Object.assign({},r),written:false,stageState:null,sent:false,seen:false,tone:0,log:null,writes:[]};
  let items=[], sents=[], stage, R=null, noteR=null;
  if(source==='voice'){
    sents=sampleSentences(c).map(t=>({t,src:'voice'}));
    const f=sampleFindings(c,r); items=f.items; stage=f.stage;
    if(state.notes.trim()){
      const off=sents.length; noteR=parseDebrief(state.notes,c);
      noteR.sents.forEach(t=>sents.push({t,src:'note'}));
      itemsFromParse(noteR,c,r,off,false).forEach(x=>{ if(!x.append&&x.rk!=='tasks'){ const i=items.findIndex(y=>y.rk===x.rk&&!y.append); if(i>=0){ items[i]=x; return; } } items.push(x); });
    }
  } else {
    R=parseDebrief(state.typed,c);
    sents=R.sents.map(t=>({t,src:'typed'}));
    items=itemsFromParse(R,c,r,0,true);
    const up=R.stage.to-c.stage;
    stage={from:r.stageIdx,to:Math.min(STAGES.length-1,r.stageIdx+Math.max(0,up)),conf:R.stage.conf,signals:R.signals,hold:R.hold};
    if(R.signals.some(x=>x.k==='signed')) stage.to=4;
  }
  const order=['Activity & tasks','Contact','Account','Opportunity','Contact roles'];
  items.sort((a,b)=>order.indexOf(a.grp)-order.indexOf(b.grp));
  items.forEach((it,i)=>{ it.id=deb.id+'-'+i; it.from=r[it.rk]; });
  checkPerms(items,r);
  items.forEach(it=>{ it.on=!it.lock&&it.conf>=70; });
  deb.items=items; deb.sents=sents; deb.stage=stage; deb.R=R; deb.noteR=noteR;
  if(source==='voice'){ deb.scores={trans:92,quality:78,qtip:'Strong detail. Tip: add a quantified ROI target next time.'}; }
  else {
    const hits=COACH.filter(x=>R.cover[x.k]), miss=COACH.filter(x=>!R.cover[x.k]);
    const q=Math.min(98,30+hits.length*8+Math.min(8,Math.floor(R.words/15)));
    deb.scores={trans:null,quality:q,qtip:miss.length?(q>=70?'Good detail. ':'Thin on detail. ')+'Tip: next time, '+miss[0].t.toLowerCase()+'.':'Covers every coaching point.'};
  }
  deb.activity=buildActivity(deb);
  deb.email=buildEmail(deb,0);
  return deb;
}

function buildActivity(deb){
  const c=deb.c, R=deb.R;
  if(deb.source==='voice') return {subject:'Pricing &amp; rollout discussion | Meeting | Expansion',tags:['Meeting','Expansion','Future meeting set'],
    summary:`• Met ${c.name} (${c.role}) at ${c.account} to review platform expansion across additional sites.
• Currently on a legacy in-house tool; main pain is manual reporting and no single pipeline view.
• Budget is approved for this quarter; ${c.name} is the economic buyer and is bought-in.
• Next step: send a tailored proposal and ROI summary, then reconvene to align stakeholders.`+(deb.noteR&&deb.noteR.sents.length?`\n• Written note: ${esc(deb.noteR.sents.join(' ').slice(0,160))}`:'')};
  const outcome=R.tasks.some(t=>t.meeting)?'Future meeting set':R.signals.some(x=>x.k==='proposal')?'Proposal requested':R.tasks.length?'Next step agreed':'No next step';
  const b=[`• Met ${c.name} (${c.role}) at ${c.account}${deb.meeting?' for "'+esc(deb.meeting.title)+'"':''}.`];
  if(R.pains.length) b.push('• Pain: '+esc(R.pains[0].t.replace(/[.!?]$/,''))+'.');
  if(R.budget||R.amount) b.push('• Budget: '+[R.budget?R.budget.to.toLowerCase():'',R.amount?money(R.amount.to):''].filter(Boolean).join(', ')+'.');
  if(R.roles.length) b.push('• People: '+R.roles.map(x=>esc(x.name)+(x.title?' ('+esc(x.title)+')':'')).join(', ')+'.');
  if(R.comps.length) b.push('• Competition: '+R.comps.map(x=>esc(x.name)).join(', ')+'.');
  if(R.risks.length) b.push('• Risks: '+R.risks.map(x=>x.label.toLowerCase()).join(', ')+'.');
  b.push(R.tasks.length?'• Next step: '+R.tasks.map(t=>esc(t.title.charAt(0).toLowerCase()+t.title.slice(1))+' by '+fmtD(t.due)).join('; ')+'.':'• No next step was agreed.');
  return {subject:esc(actSubject(R,c,deb.meeting)),tags:[actType(R),oppPurpose(c),outcome],summary:b.join('\n')};
}

function buildEmail(deb,tone){
  const c=deb.c, first=c.name.split(' ')[0], R=deb.R;
  const to=`${c.name.toLowerCase().replace(/[^a-z]/g,'.')}@${c.account.toLowerCase().replace(/[^a-z]/g,'')}.com`;
  const subject=`Great connecting: next steps for ${c.account}`;
  const open=tone?`Hi ${first},\n\nIt was a real pleasure talking with you today, and thank you for being so open about what is and isn't working. Here is what I heard:`:`Hi ${first},\n\nThank you for your time today. To recap what we discussed:`;
  const close=tone?`If anything else comes to mind, I'm always happy to talk it through.\n\nWarm regards,\nCory`:`If anything else comes to mind in the meantime, just let me know.\n\nBest regards,\nCory`;
  if(deb.source==='voice') return {to,subject,body:`${open}

• You're looking to expand across additional sites and move off the legacy in-house tool, with manual reporting being the biggest pain point.
• A single, unified pipeline view is the priority, and budget is approved for this quarter.

As agreed, I'll put together a tailored proposal with an ROI summary and send it over this week. From there we can align the wider team and lock in a go-live plan.

${close}`};
  const pts=[];
  R.pains.slice(0,2).forEach(p=>pts.push('• '+p.t.replace(/^(?:they(?:'re| are)?|we)\s+/i,'').replace(/^\w/,x=>x.toUpperCase())));
  if(R.budget&&R.budget.to==='Approved') pts.push('• Budget is approved'+(R.amount?' at around '+money(R.amount.to):'')+'.');
  else if(R.amount) pts.push('• You mentioned a budget of around '+money(R.amount.to)+'.');
  if(R.risks.some(x=>x.label==='Security review')) pts.push("• You flagged the security review. I'll send our security pack so your team can start early.");
  if(!pts.length) pts.push('• Where things stand today and what you want to change.');
  const mine=R.tasks.filter(t=>t.owner==='you');
  const nxt=mine.length?'Next steps from my side:\n'+mine.map(t=>'• '+t.title+' by '+fmtD(t.due)+'.').join('\n'):"I'll follow up shortly with a proposed next step.";
  return {to,subject,body:`${open}\n\n${pts.join('\n')}\n\n${nxt}\n\n${close}`};
}

function call(fn,args,res,cls){ return `<div class="call"><span class="ts">${nowTs()}</span> <span class="fn">${fn}</span>(${esc(args)})${res!=null?' → <span class="'+(cls||'ok')+'">'+esc(res)+'</span>':''}</div>`; }
function txt(t,cls){ return `<div class="call"${cls?' style="color:var(--'+cls+')"':''}>${esc(t)}</div>`; }
function lg(deb,k,st,lines,ms,reset){ const s=deb.log.find(x=>x.k===k); if(reset) s.lines=[]; if(st) s.st=st; if(lines) s.lines.push(...lines); if(ms) s.ms=ms; if(deb===state.deb) refreshAgent(); }
function agentSummary(deb){
  if(!deb||!deb.log) return 'Nothing has run yet.';
  const done=deb.log.filter(s=>s.st==='done'||s.st==='skip').length, w=deb.log.find(s=>s.st==='wait'), r=deb.log.find(s=>s.st==='run');

  steps.push({k:'match',done:1,ms:'0.3s',lines:ml,det:'Contact '+ids.Contact+' · Opportunity '+ids.Opportunity});
  const el=[call(voice?'llm.extract':'demoParser.extract',voice?'transcript, schema:"activity_v3"':'text, rules:"demo-v1"',n+' changes · '+low+' below 70%')];
  if(voice&&deb.noteR) el.push(call('demoParser.extract','written note',deb.items.filter(i=>deb.sents[i.s]&&deb.sents[i.s].src==='note').length+' changes'));
  if(miss.length) el.push(txt('Not found: '+miss.join(', ')+'.','amber'));

  let reco;
  if(moved) reco=`<div class="reco"><span>✅</span><div style="flex:1"><b>Moved to ${STAGES[to]}.</b> The stage change and close-date shift are saved on ${c.opp}.
      <div class="btnrow" style="margin-top:10px"><button class="btn btn--ghost btn--sm" onclick="undoStage()">↶ Undo move</button></div></div></div>`;
  else if(deb.stageState==='kept') reco=`<div class="reco"><span>↩️</span><div>Recommendation dismissed. Stage unchanged.</div></div>`;
  else if(deb.stage.hold){ const h=deb.stage.hold, st=deb.sents[h.s]?deb.sents[h.s].t:'';
    reco=`<div class="reco" style="border-color:rgba(242,119,140,.45);background:rgba(242,119,140,.06)"><span>⚠️</span><div><b>No stage move. ${esc(h.t)}.</b><div class="muted" style="font-size:12.5px;margin-top:3px">From: “${markPhrase(st,h.phrase)}” The stage stays at ${STAGES[from]}.</div></div></div>`; }
  else if(!rec) reco=`<div class="reco"><span>🤖</span><div><b>No stage move suggested.</b> The stage stays at ${STAGES[from]}.
      <div class="muted" style="font-size:12.5px;margin-top:3px">${from<4?`To suggest ${STAGES[from+1]}, the demo parser looks for two signals: budget confirmed, decision-maker engaged, or a proposal requested. Found: ${sigs.length?sigs.map(x=>x.t.toLowerCase()).join(', '):'none'}.`:'This deal is already at the last stage.'}</div></div></div>`;
  else reco=`<div class="reco">
      <span>🤖</span>
      <div style="flex:1">
        <div><b>${voice?'AI':'The demo parser'} recommends moving ${STAGES[from]} → ${STAGES[to]}.</b> <span class="conf conf--${confCls(deb.stage.conf)}" style="margin-left:4px">${deb.stage.conf}%</span></div>
        <div class="muted" style="font-size:12.5px;margin-top:3px">${voice?`Budget confirmed, decision-maker engaged, and the agreed next step is a proposal. That meets the criteria for ${STAGES[to]}.`:'Signals: '+sigs.map(x=>`${x.t.toLowerCase()} (“${esc(x.phrase)}”)`).join(', ')+'.'}</div>
        ${lock?'<div class="prop__why lockwhy">🔒 Closed Won needs a signed order form attached in the CRM. Move it there once the paperwork is in.</div>':''}
        <div class="btnrow" style="margin-top:11px">
          <button class="btn btn--lime" onclick="acceptMove()" ${lock?'disabled':''}>Accept &amp; move stage</button>
          <button class="btn btn--ghost" onclick="keepStage()">Keep current</button>
        </div>
      </div>
    </div>`;
  return `<div class="card">
    <div class="card__h"><span class="ic">📈</span><h3>Opportunity stage</h3></div>
    <div class="card__b"><div class="pipe">${pipe}</div>${reco}</div>
  </div>`;
}
function emailCard(deb){
  const e=deb.email;
  return `<div class="card">
    <div class="card__h"><span class="ic">✉️</span><h3>AI follow-up email</h3><span class="muted" id="emState" style="font-weight:400;font-size:12px;margin-left:auto">${deb.sent?'sent':'draft · editable'}</span></div>
    <div class="card__b">
      <div class="email">
        <div class="email__row"><span class="lab">To</span><input id="emTo" aria-label="To" value="${esc(e.to)}" oninput="state.deb.email.to=this.value" ${deb.sent?'readonly':''}></div>
        <div class="email__row"><span class="lab">Subject</span><input id="emSub" aria-label="Subject" value="${esc(e.subject)}" oninput="state.deb.email.subject=this.value" ${deb.sent?'readonly':''}></div>
        <textarea class="email__body" id="emBody" aria-label="Email body" oninput="state.deb.email.body=this.value" ${deb.sent?'readonly':''}>${esc(e.body)}</textarea>
      </div>
      <div class="btnrow" style="margin-top:14px">
        <button class="btn btn--lime" id="sendBtn" ${deb.sent?'disabled':''} onclick="sendEmail()">${deb.sent?'✓ Sent to client':'Send to client'}</button>
        <button class="btn btn--ghost" id="regenBtn" ${deb.sent?'disabled title="Already sent"':''} onclick="regenEmail()">Regenerate</button>
        <span class="muted" id="emHelp" style="font-size:12.5px">${deb.sent?'Sent and logged on the activity.':'Nothing is sent until you press Send. A copy is logged on the activity.'}</span>
      </div>
    </div>
  </div>`;
}
function renderResults(){
  const deb=state.deb;
  const sc=deb.scores;
  $('stage').innerHTML=`
  <div class="layout fade">
   <div class="main">
    ${deb.source==='typed'?`<div class="demo-note" style="margin-bottom:16px"><span>🧪</span><div><b>Read by the demo parser.</b> These proposals come from fixed rules. The production build uses a language model. The approval rules are the same: you review every change before anything is written.</div></div>`:''}
    <div class="card">
      <div class="card__h"><span class="ic">📝</span><h3>Transcription &amp; quality</h3><span class="sp muted" style="font-size:12px">${deb.source==='voice'?'Voice · sample recording':'Typed · demo parser'}</span></div>
      <div class="card__b">
        <div class="scorebar" style="margin-bottom:16px">
          <div class="score">
            <div class="score__top"><span class="score__lbl">Transcription confidence</span><span class="score__val" style="color:var(--teal)">${sc.trans!=null?sc.trans:'n/a'}</span></div>
            <div class="score__bar"><div class="score__fill" style="width:${sc.trans||0}%;background:var(--teal)"></div></div>
            <div class="score__tip">💡 ${sc.trans!=null?'Clear audio. Names matched to CRM spelling.':'Typed debrief. No audio to transcribe.'}</div>
          </div>
          <div class="score">
            <div class="score__top"><span class="score__lbl">Note quality</span><span class="score__val" style="color:var(--lime)">${sc.quality}</span></div>
            <div class="score__bar"><div class="score__fill" style="width:${sc.quality}%;background:var(--lime)"></div></div>
            <div class="score__tip">💡 ${sc.qtip}</div>
          </div>
        </div>
        <div class="transcript" id="transcript"></div>
        <div class="note" style="margin-top:8px">Underlined sentences fed a proposed change. Point at or tick a change below to light up its sentence.</div>
      </div>
    </div>
    ${activityCard(deb)}
    ${crmCard(deb)}
    ${followCard(deb)}
    ${stageCard(deb)}
    ${emailCard(deb)}
    <div class="btnrow" style="margin-top:18px">
      <button class="btn btn--ghost" onclick="restart()">↺ Record another</button>
      <button class="btn btn--ghost" onclick="openHistory()">🕘 Session history</button>
    </div>
   </div>
   <div class="aside">${agentCard(deb)}</div>
  </div>`;
  if(deb.seen||RM) $('transcript').innerHTML=transcriptHtml(deb); else { deb.seen=true; typeTranscript(); }
}
function fieldUpd(name,from,to){
  return `<div class="upd"><span class="ck">${tick3()}</span><div class="upd__f"><div class="upd__name">${name}</div>
    <div class="upd__chg"><b>${from}</b><span class="arrow">→</span><b style="color:var(--green)">${to}</b></div></div></div>`;
}
function tickProp(id,on){
  const d=state.deb, it=d.items.find(x=>x.id===id); if(!it||it.lock) return; it.on=on;
  const row=document.querySelector(`.prop[data-id="${id}"]`); if(row){ row.classList.toggle('on',on); row.querySelector('.cbx').innerHTML=on?tick3():''; }
  hl(it.s); updApprove();
}
function updApprove(){
  const d=state.deb, n=d.items.filter(i=>i.on).length, b=$('apprBtn');
  if(b){ b.disabled=!n; b.textContent='Approve & write '+n+' change'+(n===1?'':'s'); if(n) b.removeAttribute('aria-describedby'); else b.setAttribute('aria-describedby','apprWhy'); }
  const w=$('apprWhy'); if(w) w.textContent=n?'':'Tick at least one change to write.';
  const sc=$('selCount'); if(sc) sc.textContent=n+' selected';
}
function tickAll(v){ state.deb.items.forEach(i=>{ if(!i.lock){ i.on=v; const row=document.querySelector(`.prop[data-id="${i.id}"]`); if(row){ row.classList.toggle('on',v); row.querySelector('.cbx').innerHTML=v?tick3():''; row.querySelector('input').checked=v; } } }); updApprove(); }
function writesFirst(deb){ return deb.log.find(s=>s.k==='writes').st==='todo'; }
function approveWrites(){
  const deb=state.deb, c=deb.c, on=deb.items.filter(i=>i.on); if(!on.length){ toast('Tick at least one change to write.'); return; }
  const r=crmFor(c); on.forEach(i=>applyItem(r,i));
  deb.written=true; deb.writtenAt=new Date();
  const ids=OPP_META[c.id].ids, lines=[], byObj={};
  on.filter(i=>!['tasks','acts','roles'].includes(i.rk)).forEach(i=>{ const o=RK_OBJ[i.rk]; if(!(byObj[o]=byObj[o]||[]).includes(RK_API[i.rk])) byObj[o].push(RK_API[i.rk]); });
  Object.keys(byObj).forEach(o=>lines.push(call('crm.update',o+' '+ids[o]+', {'+byObj[o].join(', ')+'}','200 OK')));
  on.filter(i=>i.rk==='acts').forEach(i=>lines.push(call('crm.create','Activity "'+i.to+'"','201 Created')));
  on.filter(i=>i.rk==='tasks').forEach(i=>lines.push(call('crm.create',(i.task.meeting?'Event':'Task')+' "'+i.task.title+'"','201 Created')));
  on.filter(i=>i.rk==='roles').forEach(i=>lines.push(call('crm.create','OpportunityContactRole "'+i.to.split(' · ')[0]+'"','201 Created')));
  lg(deb,'writes','done',lines,'0.6s',writesFirst(deb));
  lg(deb,'approve','done',[txt('You approved '+on.length+' of '+deb.items.length+' changes.','green')],hhmm(new Date()));
  renderResults(); updHistCount();
  const cc=$('crmCard'); if(cc) cc.scrollIntoView({block:'start',behavior:RM?'auto':'smooth'});
  toast(on.length+' change'+(on.length===1?'':'s')+' written to the CRM.','Undo',()=>undoWrites(deb));
}
function undoWrites(deb){
  deb=deb||state.deb; if(!deb||!deb.written) return;
  const r=crmFor(deb.c), on=deb.items.filter(i=>i.on);
  on.forEach(i=>{ r[i.rk]=deb.before[i.rk]; if(i.rk==='amount') r.amountN=deb.before.amountN; if(i.rk==='tasks') r.taskN=deb.before.taskN; });
  deb.written=false;
  lg(deb,'writes',null,[call('crm.revert',on.length+' changes from this debrief','200 OK · restored','warn')]);
  lg(deb,'approve','wait',[txt('Write undone. Waiting for you again.','amber')]);
  if(state.phase==='results'&&state.deb===deb) renderResults();
  updHistCount(); toast('Write undone. The record is back to how it was.');
}
function acceptMove(){
  const deb=state.deb, to=deb.stage.to; if(to===4){ toast('Closed Won needs a signed order form in the CRM.'); return; }
  deb.stageState='accepted'; state.accepted=true;
  const r=crmFor(deb.c); r.stage=STAGES[to]; r.stageIdx=to;
  lg(deb,'writes','done',[call('crm.update','Opportunity '+OPP_META[deb.c.id].ids.Opportunity+', {StageName:"'+STAGES[to]+'"}','200 OK')],null,writesFirst(deb));
  lg(deb,'approve',null,[txt('You accepted the stage move to '+STAGES[to]+'.','green')]);
  renderResults(); updHistCount(); toast('Opportunity moved to '+STAGES[to]+'.','Undo',()=>undoStage(deb));
}
function undoStage(deb){
  deb=deb||state.deb; if(!deb||deb.stageState!=='accepted') return;
  const r=crmFor(deb.c); r.stage=deb.before.stage; r.stageIdx=deb.before.stageIdx;
  deb.stageState=null; state.accepted=false;
  lg(deb,'writes',null,[call('crm.update','Opportunity '+OPP_META[deb.c.id].ids.Opportunity+', {StageName:"'+deb.before.stage+'"}','200 OK · reverted','warn')]);
  if(state.phase==='results'&&state.deb===deb) renderResults();
  updHistCount(); toast('Stage move undone. Back at '+deb.before.stage+'.');
}
function keepStage(){
  const deb=state.deb; deb.stageState='kept';
  lg(deb,'approve',null,[txt('You kept the stage at '+STAGES[deb.stage.from]+'.')]);
  toast('Kept current stage. Recommendation dismissed.');
  const r=document.querySelector('.reco'); if(r) r.innerHTML='<span>↩️</span><div>Recommendation dismissed. Stage unchanged.</div>';
}
function sendEmail(){
  const deb=state.deb; if(deb.sent) return;
  deb.sent=true; state.sent=true;
  lg(deb,'writes','done',[call('email.send','to:"'+deb.email.to+'"','202 Accepted'),call('crm.create','EmailMessage on the activity','201 Created')],null,writesFirst(deb));
  lg(deb,'approve',null,[txt('You sent the follow-up email.','green')]);
  const b=$('sendBtn'); if(b){ b.disabled=true; b.textContent='✓ Sent to client'; }
  const g=$('regenBtn'); if(g){ g.disabled=true; g.title='Already sent'; }
  ['emTo','emSub','emBody'].forEach(id=>{ const e=$(id); if(e) e.readOnly=true; });
  const es=$('emState'); if(es) es.textContent='sent'; const eh=$('emHelp'); if(eh) eh.textContent='Sent and logged on the activity.';
  updHistCount(); toast('Follow-up email sent and logged on the activity.');
}
function regenEmail(){
  const deb=state.deb; if(deb.sent) return;
  deb.tone=deb.tone?0:1; const e=buildEmail(deb,deb.tone); deb.email.body=e.body;
  const t=$('emBody'); if(t) t.value=e.body;
  lg(deb,'email',null,[call('email.draft','tone:"'+(deb.tone?'warmer':'standard')+'"',wc(e.body)+' words · draft, not sent')]);
  toast(deb.tone?'Regenerated with a warmer tone (demo).':'Regenerated with the standard tone (demo).');
}
function restart(){ stopTimer(); state=Object.assign(state,{phase:'pick',contact:null,secs:0,recording:false,notes:'',accepted:false,sent:false,search:'',mode:'voice',typed:'',meeting:null,deb:null}); render(); }

/* typewriter transcript */
const TRANSCRIPT="So I just wrapped with {NAME} over at {ACC} — {ROLE}. Really positive meeting. They're keen to expand the platform across a few more sites; right now they're on a legacy in-house tool and the big frustration is manual reporting, no single view of the pipeline. They have about 120 active users on it today. Good news is budget's approved for this quarter and {FIRST} is basically the decision-maker, so we're not waiting on anyone. We agreed the next step is for me to send over a tailored proposal with an ROI summary, then get the wider team aligned. I'll book a follow-up for next week.";
function typeTranscript(){
  const deb=state.deb, el=$('transcript'); if(!el)return;
  const text=deb.sents.map(x=>x.t).join(' ');
  let i=0; el.innerHTML='<span class="cur"></span>';
  clearInterval(el._t);
  el._t=setInterval(()=>{ i+=2; if(i>=text.length||!document.body.contains(el)){ clearInterval(el._t); el.innerHTML=transcriptHtml(deb); return;} el.textContent=text.slice(0,i); el.insertAdjacentHTML('beforeend','<span class="cur"></span>'); },14);
}

render();
</script>
</body>
