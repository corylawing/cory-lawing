<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expense Guard — interactive demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* =======================================================================
   Expense Guard — AI expense-compliance demo. Finance uploads expenses,
   they're cross-checked against CRM (Salesforce) activity, and the AI
   flags policy breaches (over threshold) and customer-booked expenses
   with no matching account activity that day. All data is mock.
   ======================================================================= */
:root{
  --bg:#0b0d12; --panel:#13161f; --panel2:#191d29; --line:#272d3c; --line2:#333a4d;
  --ink:#eef1f6; --ink2:#c7cdda; --muted:#8a93a6; --faint:#5d6577;
  --lime:#d9f77b; --lime-ink:#0a0a0a; --lime-line:rgba(217,247,123,.4);
  --teal:#3dc6ce; --amber:#f2c879; --rose:#f2778c; --violet:#b79cff; --green:#5bd08a;
  --green-soft:rgba(91,208,138,.13); --amber-soft:rgba(242,200,121,.13);
  --rose-soft:rgba(242,119,140,.13); --violet-soft:rgba(183,156,255,.13);
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;min-height:100%;}
body{background:var(--bg);color:var(--ink);font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;font-size:14px;line-height:1.5;}
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
.num{font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3{margin:0;}
.app{max-width:1180px;margin:0 auto;padding:20px 20px 90px;}
.muted{color:var(--muted);} .faint{color:var(--faint);}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.top__mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--lime),#aee04f);display:grid;place-items:center;color:var(--lime-ink);flex-shrink:0;box-shadow:0 8px 22px -8px var(--lime);}
.top__eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);}
.top__title{font-size:19px;font-weight:800;letter-spacing:-.02em;}
.top__spacer{flex:1;}
.pill{font-size:11.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px;}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:13px;border-radius:11px;padding:9px 15px;border:1px solid transparent;transition:.14s;white-space:nowrap;}
.btn svg{width:16px;height:16px;}
.btn--lime{background:var(--lime);color:var(--lime-ink);}
.btn--lime:hover{filter:brightness(1.06);transform:translateY(-1px);}
.btn--ghost{background:transparent;border-color:var(--line2);color:var(--ink2);}
.btn--ghost:hover{border-color:var(--faint);color:var(--ink);}
.btn--rose{background:var(--rose);color:#0a0a0a;}
.btn--green{background:var(--green);color:#062315;}
.btn--sm{padding:7px 12px;font-size:12px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);}
.card__b{padding:18px;}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:700;}

/* ---------- UPLOAD ---------- */
.upload{max-width:560px;margin:30px auto;text-align:center;}
.drop{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:40px 26px;background:var(--panel);transition:.2s;}
.drop:hover{border-color:var(--lime-line);background:var(--panel2);}
.drop__ic{width:60px;height:60px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 16px;color:var(--lime);}
.drop h2{font-size:20px;margin-bottom:6px;}
.drop p{color:var(--muted);font-size:13.5px;margin:0 auto 18px;max-width:380px;}
.synccheck{display:inline-flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink2);margin-top:16px;}
.cbx{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);display:grid;place-items:center;}
.cbx.on{background:var(--lime);border-color:var(--lime);}

/* processing */
.proc{max-width:420px;margin:36px auto;}
.proc__ring{width:70px;height:70px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--lime);margin:0 auto 22px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.pstep{display:flex;align-items:center;gap:11px;padding:9px 0;color:var(--faint);font-size:13.5px;transition:.25s;}
.pstep.on{color:var(--ink);} .pstep.done{color:var(--ink2);}
.pstep .d{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line2);flex-shrink:0;display:grid;place-items:center;font-size:10px;}
.pstep.done .d{background:var(--green);border-color:var(--green);color:#06231e;}
.pstep.on .d{border-color:var(--lime);}

/* ---------- AI banner ---------- */
.aibanner{background:linear-gradient(120deg,rgba(217,247,123,.08),rgba(217,247,123,.02));border:1px solid var(--lime-line);border-radius:var(--radius);padding:16px 18px;display:flex;gap:13px;margin-bottom:18px;}
.aibanner__ic{width:36px;height:36px;border-radius:11px;background:var(--lime);color:var(--lime-ink);display:grid;place-items:center;flex-shrink:0;}
.aibanner__tag{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--lime);border:1px solid var(--lime-line);border-radius:999px;padding:2px 8px;}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px;}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px 16px;}
.kpi__l{font-size:11.5px;color:var(--muted);}
.kpi__v{font-size:24px;font-weight:800;margin-top:7px;letter-spacing:-.02em;}
.kpi__s{font-size:11.5px;margin-top:3px;}

/* thresholds */
.policy{display:flex;align-items:center;gap:13px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:18px;}
.policy__lbl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700;display:flex;align-items:center;gap:7px;}
.thr{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2);}
.thr input{width:62px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--ink);padding:5px 7px;font-size:12.5px;text-align:right;outline:none;font-family:inherit;}
.thr input:focus{border-color:var(--lime-line);}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--line2);border-radius:999px;font-size:12.5px;font-weight:600;color:var(--muted);background:var(--panel);transition:.13s;}
.chip.on{border-color:var(--lime);background:rgba(217,247,123,.1);color:var(--lime);}
.chip .ct{font-size:11px;opacity:.8;}

/* table */
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.thead,.trow{display:grid;grid-template-columns:96px 1.5fr 1.1fr 92px 1.2fr 40px;gap:12px;align-items:center;}
.thead{padding:11px 18px;border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700;}
.thead .r,.trow .r{text-align:right;}
.trow{padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;}
.trow:last-child{border-bottom:none;}
.trow:hover{background:var(--panel2);}
.trow.flag{box-shadow:inset 3px 0 0 var(--flagc,transparent);}
.merch{font-weight:600;font-size:13.5px;}
.sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
.amt{font-weight:700;font-size:14px;}
.acct{font-size:12.5px;}
.cattag{font-size:10.5px;font-weight:700;letter-spacing:.02em;border-radius:6px;padding:2px 7px;background:var(--panel2);color:var(--ink2);border:1px solid var(--line2);white-space:nowrap;}
.status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap;}
.s-clear{background:var(--green-soft);color:var(--green);}
.s-over{background:var(--amber-soft);color:var(--amber);}
.s-noact{background:var(--rose-soft);color:var(--rose);}
.s-dup{background:var(--violet-soft);color:var(--violet);}
.s-rcpt{background:var(--amber-soft);color:var(--amber);}
.s-appr{background:rgba(91,208,138,.18);color:var(--green);}
.s-rej{background:var(--rose-soft);color:var(--rose);}
.chev{color:var(--faint);}

/* detail drawer */
.scrim{position:fixed;inset:0;background:rgba(6,8,14,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.2s;z-index:40;}
.scrim.on{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:50;display:flex;flex-direction:column;}
.drawer.on{transform:none;}
.drawer__h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;}
.drawer__x{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink2);font-size:18px;line-height:1;}
.drawer__b{flex:1;overflow:auto;padding:20px;}
.drawer__f{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;}
.bigamt{font-size:30px;font-weight:800;letter-spacing:-.02em;}
.verdict{border-radius:12px;padding:14px 16px;margin:16px 0;border:1px solid var(--line2);}
.verdict__h{display:flex;align-items:center;gap:9px;font-weight:700;margin-bottom:8px;}
.verdict ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--ink2);}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--muted);}

/* activity timeline */
.tl{margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.tl__r{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:12.5px;}
.tl__r:last-child{border-bottom:none;}
.tl__r .d{width:8px;height:8px;border-radius:50%;background:var(--teal);flex-shrink:0;}
.tl__r.gap{background:var(--rose-soft);}
.tl__r.gap .d{background:var(--rose);}
.tl__r.match{background:var(--green-soft);}
.tl__r.match .d{background:var(--green);}

/* spend memory cards */
.memgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;}
.memcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;}
.memcard.flag{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose-soft);}
.memcard__top{display:flex;align-items:center;gap:9px;}
.memava{width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink2);flex-shrink:0;}
.delta{font-size:12px;font-weight:800;}
.delta.hi{color:var(--rose);} .delta.up{color:var(--amber);} .delta.dn{color:var(--green);}
.membar{position:relative;height:7px;border-radius:999px;background:var(--panel2);margin:11px 0 9px;overflow:hidden;}
.membar__fill{height:100%;border-radius:999px;}
.membar__avg{position:absolute;top:-2px;bottom:-2px;left:55.5%;width:2px;background:var(--ink2);opacity:.65;z-index:2;}
.memcard__foot{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);}
@media(max-width:820px){ .memgrid{grid-template-columns:repeat(2,1fr);} }
@media(max-width:680px){ .memgrid{grid-template-columns:1fr;} }

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--lime);color:var(--lime-ink);padding:11px 18px;border-radius:11px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:90;box-shadow:0 14px 36px rgba(0,0,0,.5);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.fade{animation:fadeup .35s ease;}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:820px){ .kpis{grid-template-columns:repeat(2,1fr);} }
@media(max-width:680px){
  .thead{display:none;}
  .trow{grid-template-columns:1fr auto;gap:8px 12px;}
  .trow .cat-cell{grid-column:1;} .trow .amt-cell{grid-column:2;text-align:right;}
  .trow .acct-cell{grid-column:1/-1;} .trow .status-cell{grid-column:1/-1;}
  .trow .chev{display:none;}
  .policy{flex-direction:column;align-items:flex-start;}
}

/* =======================================================================
   Upgrade layer. Everything below adds to the original; nothing above
   was removed. Same palette, same type, same shapes.
   ======================================================================= */
html,body{height:100%;}
body{height:100vh;height:100dvh;overflow:hidden;}
.vp{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}
.small{font-size:12.5px;}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--lime);font-weight:600;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--lime-line);}
.linkbtn:hover{text-decoration-color:var(--lime);}
.pill .dot.off{background:var(--amber);box-shadow:0 0 8px var(--amber);}
.kbd{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:0 6px;color:var(--ink2);background:var(--panel2);display:inline-block;min-width:20px;text-align:center;line-height:18px;}

/* upload, real file input + example */
.upload{max-width:660px;}
.drop{cursor:pointer;}
.drop.over{border-color:var(--lime);border-style:solid;background:rgba(217,247,123,.06);}
.drop.over .drop__ic{background:var(--lime);color:var(--lime-ink);}
.drop__acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.drop__hint{font-size:12px;color:var(--faint);margin-top:12px;}
.drop__busy{font-size:12.5px;color:var(--lime);margin-top:12px;}
.drop__busy:empty{display:none;}
.uperr{margin-top:14px;text-align:left;border:1px solid var(--rose);background:var(--rose-soft);border-radius:14px;padding:13px 16px;}
.uperr__h{display:flex;align-items:center;gap:9px;color:var(--rose);font-size:13.5px;}
.uperr__h .linkbtn{margin-left:auto;color:var(--ink2);}
.uperr ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink2);line-height:1.6;}
.upcard{text-align:left;margin-top:14px;padding:16px 18px;}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin:10px 0 10px;}
.colk{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;}
.colk b{font-size:12.5px;color:var(--lime);font-weight:600;}
.req,.opt{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 7px;margin-left:6px;}
.req{color:var(--lime);border:1px solid var(--lime-line);}
.opt{color:var(--muted);border:1px solid var(--line2);}
.upx{text-align:left;margin-top:14px;overflow:hidden;}
.upx__h{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
.fileic{width:38px;height:44px;border-radius:7px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--lime);letter-spacing:.04em;flex-shrink:0;position:relative;}
.fileic:after{content:"";position:absolute;top:-1px;right:-1px;width:11px;height:11px;background:var(--bg);border-left:1px solid var(--line2);border-bottom:1px solid var(--line2);border-bottom-left-radius:4px;}
.upx__n{font-size:13px;font-weight:600;color:var(--ink);word-break:break-all;}
.upx__acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;}
.csvta{display:block;width:100%;min-height:170px;background:#0e1118;color:var(--ink2);border:0;font-size:12px;line-height:1.7;padding:12px 14px;resize:vertical;white-space:pre;overflow:auto;outline:none;tab-size:2;}
.csvta:focus{box-shadow:inset 0 0 0 1px var(--lime-line);}
.upx__f{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;}
.proc__f{text-align:center;font-size:12.5px;margin:-8px 0 14px;}

/* banner additions */
.aibanner__acts{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:11px;}
.aibanner__note{margin-top:8px;font-size:12.5px;color:var(--amber);}

/* agent activity (batch and per expense) */
.agent{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;}
.agent>summary{list-style:none;cursor:pointer;padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:13px;min-height:46px;}
.agent>summary b{white-space:nowrap;}
.agent>summary .muted{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.agent>summary::-webkit-details-marker{display:none;}
.agent__ic{width:26px;height:26px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;color:var(--lime);flex-shrink:0;}
.agent .caret{margin-left:auto;color:var(--faint);transition:transform .2s;font-size:16px;}
.agent[open] .caret{transform:rotate(90deg);}
.calls{border-top:1px solid var(--line);padding:10px 16px 12px;font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;}
.call{display:grid;grid-template-columns:16px 1fr auto;gap:8px;padding:3px 0;align-items:baseline;}
.call .g{font-weight:800;text-align:center;}
.call .ln{min-width:0;overflow-wrap:anywhere;}
.call .fn{color:var(--teal);}
.call .args{color:var(--muted);}
.call .arrow{color:var(--faint);}
.call .res{color:var(--ink2);}
.call .ms{color:var(--faint);font-size:11px;}
.call.ok .g{color:var(--green);} .call.warn .g{color:var(--amber);} .call.fail .g{color:var(--rose);}
.call.skip .g{color:var(--faint);} .call.wait .g{color:var(--violet);}
.call.fail .res{color:var(--rose);} .call.warn .res{color:var(--amber);} .call.wait .res{color:var(--violet);}
.agent__f{padding:0 16px 12px;font-size:12px;color:var(--faint);}
.agent--d{margin:20px 0 0;background:var(--panel2);}
.agent--d .calls{padding:10px 14px 12px;}

/* policy row additions */
.thr select{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;color:var(--ink);padding:5px 7px;font-size:12.5px;font-family:inherit;outline:none;}
.thr select:focus{border-color:var(--lime-line);}

/* toolbar, tabs, progress */
.tbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.tabs{display:inline-flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px;}
.tab .ct{font-size:11px;opacity:.75;}
.tab.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2);}
.tbar__acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;}
.frow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.frow .filters{margin-bottom:0;flex:1;}
.prog{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);}
.prog__bar{width:120px;height:6px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;}
.prog__bar i{display:block;height:100%;background:var(--lime);border-radius:999px;transition:width .3s;}
.trow.sel{background:var(--panel2);outline:1px solid var(--lime-line);outline-offset:-1px;}
.trow:focus-visible{outline:2px solid var(--lime);outline-offset:-2px;}

<script>
const $=id=>document.getElementById(id);
const RM=(()=>{try{return window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(_){return false;}})();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,actLabel,fn){
  const t=$('toast');t.innerHTML='';
  const s=document.createElement('span');s.textContent=m;t.appendChild(s);
  if(actLabel){const b=document.createElement('button');b.type='button';b.textContent=actLabel;b.onclick=()=>{t.classList.remove('show');fn();};t.appendChild(b);}
  t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),actLabel?5200:2300);
}
const money=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:0});
const clone=o=>JSON.parse(JSON.stringify(o));
const hm=d=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
const hms=d=>new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',second:'2-digit'});

/* editable policy thresholds (set by Finance) */
let THRESH={Rideshare:50, Meals:75, Hotel:300, Airfare:650, 'Client entertainment':400};
const CATCAP={Rideshare:'Rideshare',Meals:'Meals',Hotel:'Hotel',Airfare:'Airfare','Client entertainment':'Client entertainment'};

/* Salesforce activity by account (March) — used for the cross-check */
const ACTIVITY={
  'Atlas Lyon':['Mar 3','Mar 12','Mar 19'],
  'Bright Systems':['Mar 5','Mar 14'],
  'Gent Digital':['Mar 8','Mar 21'],
  'Pearl Logistics':['Mar 2','Mar 17'],
  'Camden Industries':['Mar 11']
};
/* what each logged activity was (fictional) */
const ACT_DETAIL={
  'Atlas Lyon|Mar 3':{type:'Call',title:'Discovery call with procurement'},
  'Atlas Lyon|Mar 12':{type:'Meeting',title:'On-site workshop at the Lyon office'},
  'Atlas Lyon|Mar 19':{type:'Call',title:'Proposal follow-up'},
  'Bright Systems|Mar 5':{type:'Call',title:'Intro call with the IT director'},
  'Bright Systems|Mar 14':{type:'Meeting',title:'Solution demo with the CFO'},
  'Gent Digital|Mar 8':{type:'Meeting',title:'Kickoff video call'},
  'Gent Digital|Mar 21':{type:'Visit',title:'Site visit and team dinner'},
  'Pearl Logistics|Mar 2':{type:'Call',title:'Renewal check-in'},
  'Pearl Logistics|Mar 17':{type:'Visit',title:'Warehouse site visit'},
  'Camden Industries|Mar 11':{type:'Meeting',title:'Quarterly business review'}
};
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
/* day number for a "Mar 12" label; works across months so any uploaded date compares correctly */
const DAYNUM=d=>{const p=String(d).split(' ');const mi=MONTHS.indexOf(p[0]);return Math.round(Date.UTC(2026,mi<0?2:mi,parseInt(p[1],10)||1)/864e5);};
const fromDayNum=n=>{const dt=new Date(n*864e5);return MONTHS[dt.getUTCMonth()]+' '+dt.getUTCDate();};

/* uploaded expense batch (mock) */
let EXPENSES=[
  {id:'E-1041', emp:'Mara Lin',   cat:'Client entertainment', merch:'Le Comptoir (dinner, 4)', amt:312.40, date:'Mar 12', acct:'Atlas Lyon',      rcpt:true},
  {id:'E-1042', emp:'Mara Lin',   cat:'Rideshare',            merch:'Uber — airport to client', amt:84.20,  date:'Mar 12', acct:'Atlas Lyon',      rcpt:true},
  {id:'E-1043', emp:'Jordan Diaz', cat:'Meals',               merch:'Sweetgreen (lunch)',        amt:21.50,  date:'Mar 14', acct:'Bright Systems',  rcpt:true},
  {id:'E-1044', emp:'Jordan Diaz', cat:'Client entertainment', merch:'Roka Akor (dinner, 3)',    amt:486.00, date:'Mar 15', acct:'Bright Systems',  rcpt:true},
  {id:'E-1045', emp:'Sam Okafor',  cat:'Hotel',               merch:'Marriott — 1 night',        amt:389.00, date:'Mar 20', acct:'Gent Digital',    rcpt:true},
  {id:'E-1046', emp:'Sam Okafor',  cat:'Rideshare',           merch:'Lyft — office to dinner',   amt:18.75,  date:'Mar 21', acct:'Gent Digital',    rcpt:true},
  {id:'E-1047', emp:'Priya V.',    cat:'Meals',               merch:'Hotel breakfast + dinner',  amt:96.30,  date:'Mar 17', acct:'Pearl Logistics', rcpt:true},
  {id:'E-1048', emp:'Priya V.',    cat:'Client entertainment', merch:'The Vault (drinks, 2)',    amt:140.00, date:'Mar 18', acct:'Pearl Logistics', rcpt:true},
  {id:'E-1049', emp:'Alex Reed',   cat:'Airfare',             merch:'Delta — JFK→ORD (economy)', amt:412.00, date:'Mar 10', acct:null,              rcpt:true},
  {id:'E-1050', emp:'Alex Reed',   cat:'Meals',               merch:'Nobu (client lunch, 2)',    amt:188.00, date:'Mar 23', acct:'Camden Industries',rcpt:true},
  {id:'E-1051', emp:'Mara Lin',    cat:'Client entertainment', merch:'Le Comptoir (dinner, 4)',  amt:312.40, date:'Mar 12', acct:'Atlas Lyon',      rcpt:true, dup:'E-1041'},
  {id:'E-1052', emp:'Jordan Diaz', cat:'Rideshare',           merch:'Uber — late night',          amt:67.90,  date:'Mar 26', acct:null,              rcpt:false},
  {id:'E-1053', emp:'Sam Okafor',  cat:'Meals',               merch:'Team lunch (5)',            amt:142.00, date:'Mar 19', acct:null,              rcpt:true},
  {id:'E-1054', emp:'Priya V.',    cat:'Hotel',               merch:'Hilton — 1 night',          amt:268.00, date:'Mar 17', acct:'Pearl Logistics', rcpt:true}
];
const SAMPLE=clone(EXPENSES);
let resolutions={}; // id -> 'approved' | 'rejected'

/* spend "memory" — each employee's average month over the last six months.
   The app flags anyone running significantly (>40%) above their own baseline. */
const EMP_AVG={'Mara Lin':430,'Jordan Diaz':560,'Sam Okafor':545,'Priya V.':515,'Alex Reed':540};
const OVER_AVG_PCT=40; // "significantly above" threshold
const HIST_MONTHS=['Sep','Oct','Nov','Dec','Jan','Feb'];
const EMP_HIST={ // monthly totals; each row averages to EMP_AVG
  'Mara Lin':[410,455,390,470,420,435],
  'Jordan Diaz':[530,600,545,590,520,575],
  'Sam Okafor':[560,510,580,525,555,540],
  'Priya V.':[490,540,500,530,505,525],
  'Alex Reed':[575,520,555,500,560,530]
};
function empSpend(){
  const tot={};
  EXPENSES.forEach(e=>{tot[e.emp]=(tot[e.emp]||0)+e.amt;});
  const names=Object.keys(EMP_AVG).filter(n=>tot[n]!=null).concat(Object.keys(tot).filter(n=>EMP_AVG[n]==null));
  return names.map(emp=>{
    const total=tot[emp]||0, avg=EMP_AVG[emp];
    if(avg==null) return {emp,total,avg:null,deltaPct:null,flag:false,nohist:true};
    const deltaPct=Math.round((total-avg)/avg*100);
    return {emp,total,avg,deltaPct,flag:deltaPct>=OVER_AVG_PCT};
  }).sort((a,b)=>(b.deltaPct==null?-1e9:b.deltaPct)-(a.deltaPct==null?-1e9:a.deltaPct));
}
function memFor(emp,extra){
  const total=EXPENSES.filter(e=>e.emp===emp).reduce((s,e)=>s+e.amt,0)+(extra||0), avg=EMP_AVG[emp];
  if(avg==null) return {emp,total,avg:null,deltaPct:null,flag:false,nohist:true};
  const deltaPct=Math.round((total-avg)/avg*100);
  return {emp,total,avg,deltaPct,flag:deltaPct>=OVER_AVG_PCT};
}

/* ---------- app state for the upgrade ---------- */
const REVIEWER={name:'Dana Cole',role:'Finance reviewer'};
let WIN=0;              // CRM match window in days (0 = same day, 1 = within a day)
let view='expenses';    // 'expenses' | 'audit'
let selId=null, drawerId=null, drawerMode=null;
let AUDIT=[], UNDO=[], ASKED={}, NOTES={};
let posted=false, postStep=-1;
let composeFor=null, composeDraft='', composeSubj='';
let agentOpenB=false, agentOpenD=true, fadeNext=true, modalOpen=false, stageMode='review';
let BATCH={label:'Sample batch: March expenses',source:'sample',skipped:[],orig:null};

/* ---- evaluation ---- */
function evaluate(e){
  if(resolutions[e.id]==='approved') return {key:'appr',label:'Approved',cls:'s-appr',color:'var(--green)',flag:false,reasons:['Manually approved by Finance.']};
  if(resolutions[e.id]==='rejected') return {key:'rej',label:'Rejected',cls:'s-rej',color:'var(--rose)',flag:true,reasons:['Rejected by Finance — sent back to employee.']};
  return assess(e);
}
function nearestAct(e){
  const acts=(ACTIVITY[e.acct]||[]).slice().sort((a,b)=>DAYNUM(a)-DAYNUM(b));
  if(!acts.length) return null;
  const d=acts.reduce((best,x)=>Math.abs(DAYNUM(x)-DAYNUM(e.date))<Math.abs(DAYNUM(best)-DAYNUM(e.date))?x:best,acts[0]);
  return {d,gap:Math.abs(DAYNUM(d)-DAYNUM(e.date)),det:ACT_DETAIL[e.acct+'|'+d]||null};
}
/* the AI's own judgement, ignoring any human decision */
function assess(e){
  const reasons=[]; let key='clear';
  const cap=THRESH[e.cat];
  const over = cap!=null && e.amt>cap;
  const near = e.acct?nearestAct(e):null;
  const crmChecked = !!e.acct && synced;
  const noAct = crmChecked && !(near && near.gap<=WIN);
  const dup = !!e.dup;
  const noRcpt = e.rcpt===false;
  // priority: noActivity > over > dup > receipt
  if(noAct){ key='noact'; }
  else if(over){ key='over'; }
  else if(dup){ key='dup'; }
  else if(noRcpt){ key='rcpt'; }
  if(over) reasons.push(`${esc(e.cat)} policy cap is ${money0(cap)} — this expense is ${money(e.amt)}, ${money(e.amt-cap)} over.`);
  if(noAct){
    if(!near) reasons.push(`Booked to <b>${esc(e.acct)}</b> on ${e.date}, but Salesforce has no logged activity for this account.`);
    else reasons.push(`Booked to <b>${esc(e.acct)}</b> on ${e.date}, but no call, meeting, or visit is logged at that account ${WIN?'within a day of it':'that day'}. Nearest activity: ${near.d} (${near.gap} day${near.gap===1?'':'s'} off).`);
  }
  if(dup) reasons.push(`Possible duplicate of ${e.dup} — same merchant, amount, and date.`);
  if(noRcpt) reasons.push('No receipt attached.');
  if(key==='clear'){
    if(e.acct && !synced) reasons.push(`Within policy. The CRM cross-check was off for this batch, so the link to ${esc(e.acct)} is not verified.`);
    else if(e.acct) reasons.push(near.gap===0?`Within policy and matches a logged activity at ${esc(e.acct)} on ${e.date}.`:`Within policy and matches a logged activity at ${esc(e.acct)} on ${near.d}, ${near.gap} day from the expense.`);
    else reasons.push('Within policy. Internal expense (no customer link required).');
  }
  if(cap==null) reasons.push(`No policy cap is set for ${esc(e.cat)}.`);
  const map={
    clear:{label:'Cleared',cls:'s-clear',color:'var(--green)'},
    over:{label:'Over policy',cls:'s-over',color:'var(--amber)'},
    noact:{label:'No CRM activity',cls:'s-noact',color:'var(--rose)'},
    dup:{label:'Possible duplicate',cls:'s-dup',color:'var(--violet)'},
    rcpt:{label:'Missing receipt',cls:'s-rcpt',color:'var(--amber)'}
  }[key];
  return {key,label:map.label,cls:map.cls,color:map.color,flag:key!=='clear',reasons,over,noAct,dup,noRcpt,cap,near,crmChecked};
}
function stats(){
  let total=0,atRisk=0,flagged=0,cleared=0;
  EXPENSES.forEach(e=>{const v=evaluate(e);total+=e.amt;if(v.flag){flagged++;atRisk+=e.amt;}else cleared++;});
  return {count:EXPENSES.length,total,atRisk,flagged,cleared};
}

/* confidence and the one-sentence verdict */
function confidence(e,a){
  const cap=a.cap;
  if(a.key==='clear'){
    if(e.acct&&synced) return {p:a.near&&a.near.gap===0?96:88,why:a.near&&a.near.gap===0?'Every check passed and the CRM match is on the same day.':'Every check passed. The CRM match is one day off, which the window allows.'};
    if(e.acct) return {p:78,why:'The CRM cross-check was off, so the customer link is not verified.'};
    return {p:93,why:'Internal expense within policy, with a receipt and no duplicate.'};
  }
  if(a.key==='noact'){
    let p,why;
    if(!a.near){p=90;why='Salesforce has no activity at all for this account.';}
    else if(a.near.gap<=1+WIN){p=74;why=`Lower because a ${(a.near.det?a.near.det.type:'logged activity').toLowerCase()} ${a.near.gap} day${a.near.gap===1?'':'s'} away could be a logging delay.`;}
    else if(a.near.gap<=3){p=86;why=`The nearest activity is ${a.near.gap} days away.`;}
    else {p=93;why=`The nearest activity is ${a.near.gap} days away.`;}
    if(a.over){p=Math.min(97,p+4);why+=' It is also over the cap.';}
    return {p,why};
  }
  if(a.key==='over'){const r=(e.amt-cap)/cap;
    if(r<.1) return {p:81,why:`Only ${Math.round(r*100)}% over the cap.`};
    return {p:r<.3?89:95,why:`${Math.round(r*100)}% over the cap.`};}
  if(a.key==='dup') return {p:91,why:'Same employee, merchant, amount and date as another line.'};
  return {p:98,why:'The receipt field is empty.'};
}
function verdictLine(e,a){
  const cap=a.cap;
  if(a.key==='clear'){
    const capTxt=cap!=null?`within the ${money0(cap)} ${e.cat} cap`:'within policy';
    if(e.acct&&synced){const d=a.near.det;return `Approve: ${money(e.amt)} is ${capTxt} and matches ${d?'a '+d.type.toLowerCase()+' with '+e.acct:e.acct+' activity'} on ${a.near.d}.`;}
    if(e.acct) return `Approve with care: ${money(e.amt)} is ${capTxt}, but the CRM link to ${e.acct} was not checked.`;
    return `Approve: ${money(e.amt)} is ${capTxt} and needs no customer link.`;
  }
  if(a.key==='noact') return `Ask ${e.emp} to justify it: no ${e.acct} activity is logged ${WIN?'within a day of':'on'} ${e.date}${a.near?`, the nearest is ${a.near.d}`:''}${a.over?`, and it is ${money(e.amt-cap)} over the ${money0(cap)} cap`:''}.`;
  if(a.key==='over') return `Ask ${e.emp} to justify it or reject: ${money(e.amt)} is ${money(e.amt-cap)} over the ${money0(cap)} ${e.cat} cap.`;
  if(a.key==='dup') return `Reject as a likely duplicate of ${e.dup}: same employee, merchant, amount and date.`;
  return `Hold for a receipt: ${money(e.amt)} is within policy, but no receipt is attached.`;
}
function shortReason(e,a){
  if(a.key==='noact') return a.near?`no ${e.acct} activity on ${e.date}`:`no Salesforce activity for ${e.acct}`;
  if(a.key==='over') return `${money(e.amt-a.cap)} over the ${money0(a.cap)} ${e.cat} cap`;
  if(a.key==='dup') return `duplicate of ${e.dup}`;
  if(a.key==='rcpt') return 'no receipt attached';
  return 'all checks passed';
}

/* tool-call style trace of the checks run on one expense */
const GLYPH={ok:'✓',warn:'!',fail:'✕',skip:'–',wait:'…'};
function fakeMs(seed,i){let h=0;const s=seed+':'+i;for(let k=0;k<s.length;k++)h=(h*31+s.charCodeAt(k))>>>0;return 14+h%170;}
function agentTrace(e){
  const a=assess(e), cap=a.cap, L=[];
  L.push([cap!=null?'ok':'warn','policy.lookup',`category: "${e.cat}"`,cap!=null?`cap ${money0(cap)}`:'no cap set']);
  if(cap!=null) L.push([a.over?'warn':'ok','policy.compare',`${money(e.amt)} vs ${money0(cap)}`,a.over?`over by ${money(e.amt-cap)}`:`within cap, ${Math.round(e.amt/cap*100)}% used`]);
  if(e.acct){
    if(!synced) L.push(['skip','crm.activities',`account: "${e.acct}"`,'skipped, cross-check off for this batch']);
    else {
      const lo=fromDayNum(DAYNUM(e.date)-3), hi=fromDayNum(DAYNUM(e.date)+3);
      const res=a.noAct?(a.near?`none ${WIN?'within 1 day':'on '+e.date}; nearest ${a.near.d} (${a.near.gap}d)`:'no activity on record'):`match ${a.near.d}${a.near.det?' · '+a.near.det.type:''}`;
      L.push([a.noAct?'fail':'ok','crm.activities',`"${e.acct}", ${lo} to ${hi}`,res]);
    }
  } else L.push(['ok','crm.link',`expense: ${e.id}`,'internal, no customer']);
  L.push([e.rcpt===false?'warn':'ok','receipts.get',e.id,e.rcpt===false?'missing':'attached']);
  L.push([e.dup?'warn':'ok','dupes.scan',`${e.emp}, ${money(e.amt)}, ${e.date}`,e.dup?`matches ${e.dup}`:'none']);
  const m=memFor(e.emp);
  L.push([m.nohist?'skip':m.flag?'warn':'ok','spend.history',`"${e.emp}", 6 months`,m.nohist?'no history yet':`avg ${money0(m.avg)}/mo, batch ${money0(m.total)} (${m.deltaPct>=0?'+':''}${m.deltaPct}%)`]);
  const c=confidence(e,a);
  L.push([a.flag?'warn':'ok','review.verdict',e.id,`${a.label}, confidence ${c.p}%`]);
  if(ASKED[e.id]){
    L.push(['ok','notify.email',e.emp,`sent ${hm(ASKED[e.id].ts)}, approved by ${REVIEWER.name}`]);
    L.push(ASKED[e.id].reply?['ok','inbox.reply',e.emp,`received ${hm(ASKED[e.id].reply.ts)}`]:['wait','inbox.reply',e.emp,'waiting']);
  }
  const r=resolutions[e.id];
  const last=r?AUDIT.slice().reverse().find(x=>x.ids&&x.ids.includes(e.id)&&(x.action==='Approved'||x.action==='Rejected'||x.action==='Bulk approved')):null;
  L.push([r?'ok':'wait','human.approval',REVIEWER.name,r?`${r}${last?' at '+hm(last.ts):''}`:'waiting on Finance']);
  return L;
}
function batchTrace(){
  const N=EXPENSES.length, A=EXPENSES.map(assess);
  const emps=[...new Set(EXPENSES.map(e=>e.emp))], known=emps.filter(n=>EMP_AVG[n]!=null).length;
  const accts=[...new Set(EXPENSES.filter(e=>e.acct).map(e=>e.acct))];
  const actCount=accts.reduce((s,a)=>s+(ACTIVITY[a]||[]).length,0);
  const over=A.filter(a=>a.over).length, noact=A.filter(a=>a.noAct).length, dups=A.filter(a=>a.dup).length, rc=A.filter(a=>a.noRcpt).length;
  const mem=empSpend().filter(m=>m.flag).length, fl=A.filter(a=>a.flag).length;
  const dec=EXPENSES.filter(e=>resolutions[e.id]).length, ap=EXPENSES.filter(e=>resolutions[e.id]==='approved').length;
  const sk=BATCH.skipped.length;
  return [
    [sk?'warn':'ok','csv.parse',`"${BATCH.label}"`,`${N} rows${sk?`, ${sk} skipped`:''}`],
    ['ok','employees.match',`${emps.length} names`,`${known} with history${emps.length-known?`, ${emps.length-known} new`:''}`],
    synced?[noact?'warn':'ok','crm.activities',`${accts.length} accounts, ${WIN?'within 1 day':'same day'}`,`${actCount} logged, ${noact} expense${noact===1?'':'s'} unmatched`]:['skip','crm.activities','all accounts','skipped, cross-check off'],
    [over?'warn':'ok','policy.apply',`${Object.keys(THRESH).length} caps`,`${over} over`],
    [dups?'warn':'ok','dupes.scan',`${N} rows`,`${dups} possible`],
    [rc?'warn':'ok','receipts.check',`${N} rows`,`${rc} missing`],
    [mem?'warn':'ok','spend.history',`${known} employees, 6 months`,`${mem} above +${OVER_AVG_PCT}%`],
    [fl?'warn':'ok','review.flag',`${N} expenses`,`${fl} flagged, ${N-fl} cleared`],
    [dec===N&&N?'ok':'wait','human.approval',REVIEWER.name,`${dec} of ${N} decided`],
    [posted?'ok':'wait','salesforce.write','approved only',posted?`${ap} written`:'waits for your approval']
  ];
}
function callsHTML(L,seed){
  return `<div class="calls">${L.map((c,i)=>`<div class="call ${c[0]}"><span class="g">${GLYPH[c[0]]}</span><span class="ln"><span class="fn">${c[1]}</span><span class="args">(${esc(c[2])})</span> <span class="arrow">→</span> <span class="res">${esc(c[3])}</span></span><span class="ms">${c[0]==='wait'||c[0]==='skip'?'':fakeMs(seed,i)+'ms'}</span></div>`).join('')}</div>`;
}

/* ---------- audit log ---------- */
function logA(o){
  const ids=o.ids||[];
  let what='';
  if(ids.length===1){const e=EXPENSES.find(x=>x.id===ids[0]);what=e?`${e.id} · ${e.merch} · ${money(e.amt)}`:ids[0];}
  else if(ids.length>1){what=`${ids.length} expenses: ${ids.slice(0,5).join(', ')}${ids.length>5?` and ${ids.length-5} more`:''}`;}
  AUDIT.push(Object.assign({ts:new Date(),who:REVIEWER.name,kind:'human',what,batch:BATCH.label},o));
  const ct=$('auditCt'); if(ct) ct.textContent=AUDIT.length;
}
function logBatchAI(ts){
  const t0=ts?+ts:Date.now();
  const A=EXPENSES.map(e=>[e,assess(e)]);
  const cl=A.filter(x=>!x[1].flag).map(x=>x[0].id), fl=A.filter(x=>x[1].flag).map(x=>x[0].id);
  logA({ts:new Date(t0),who:'Expense Guard AI',kind:'ai',action:'Processed batch',ids:[],what:BATCH.label,why:`${EXPENSES.length} line items read${BATCH.skipped.length?`, ${BATCH.skipped.length} skipped`:''}. ${synced?'Cross-checked against Salesforce activity.':'CRM cross-check was off.'}`});
  if(cl.length) logA({ts:new Date(t0+1400),who:'Expense Guard AI',kind:'ai',action:'Auto-cleared',ids:cl,why:'Within policy, receipt attached, no duplicate, and matched CRM activity. Waiting on Finance before anything is posted.'});
  if(fl.length){
    const cnt={};A.filter(x=>x[1].flag).forEach(x=>{cnt[x[1].label]=(cnt[x[1].label]||0)+1;});
    logA({ts:new Date(t0+1600),who:'Expense Guard AI',kind:'ai',action:'Flagged',ids:fl,why:Object.keys(cnt).map(k=>`${cnt[k]} ${k.toLowerCase()}`).join(', ')+'.'});
  }
}
const BADGE={'Approved':'g','Bulk approved':'g','Rejected':'r','Asked employee':'v','Employee replied':'t','Undo':'a','Reopened':'a','Added expense':'l','Policy changed':'','Processed batch':'l','Auto-cleared':'g','Flagged':'a','Posted to Salesforce':'l','Wrote to Salesforce':'l'};
function auditHTML(){
  if(!AUDIT.length) return `<div class="tblwrap"><div class="empty muted"><b>No decisions yet</b>Approve or reject an expense and it is recorded here with who, when and why.</div></div>`;
  const rows=AUDIT.slice().reverse().map(a=>{
    const ini=a.kind==='ai'?'AI':a.who.split(' ').map(w=>w[0]).join('').slice(0,2);
    const role=a.kind==='ai'?'Agent':a.kind==='emp'?'Employee':REVIEWER.role;
    return `<div class="arow">
      <div class="a-when num muted">${hms(a.ts)}</div>
      <div class="a-who awho"><span class="memava ${a.kind==='ai'?'ai':a.kind==='emp'?'emp':''}">${esc(ini)}</span><div style="min-width:0"><div style="font-weight:600">${esc(a.who)}</div><div class="sub">${role}</div></div></div>
      <div class="a-act"><span class="abadge ${BADGE[a.action]||''}">${esc(a.action)}</span></div>
      <div class="a-det">${a.what?`<div class="awhat">${esc(a.what)}</div>`:''}<div class="awhy">${esc(a.why||'')}</div></div>
    </div>`;}).join('');
  return `<div class="ameta">${AUDIT.length} entr${AUDIT.length===1?'y':'ies'}, newest first. Every decision is kept, including undone ones.</div>
  <div class="audit"><div class="ahead"><div>When</div><div>Who</div><div>Decision</div><div>Expense and reason</div></div>${rows}</div>`;
}

/* ---------- decisions, undo ---------- */
function canDecide(){
  if(posted){toast('This batch is posted. Start again to review a new batch.');return false;}
  if(postStep>=0){toast('Posting to Salesforce. One moment.');return false;}
  return true;
}
function defaultWhy(e,r){
  const a=assess(e);
  let w;
  if(r==='approved') w=a.key==='clear'?'Accepted the AI clearance.':`Approved over the AI flag (${a.label.toLowerCase()}: ${shortReason(e,a)}).`;
  else w=a.key==='clear'?'Rejected although the AI cleared it.':`Rejected: ${shortReason(e,a)}. Sent back to ${e.emp}.`;
  const n=(NOTES[e.id]||'').trim();
  if(ASKED[e.id]&&ASKED[e.id].reply) w+=' Employee reply was on file.';
  return n?`${w}\nNote: ${n}`:w;
}
function decide(ids,r,label,why,action){
  const prev={};ids.forEach(id=>{prev[id]=resolutions[id]||null;});
  ids.forEach(id=>{if(r)resolutions[id]=r;else delete resolutions[id];});
  UNDO.push({ids,prev,label});
  logA({action:action||(r==='approved'?'Approved':r==='rejected'?'Rejected':'Reopened'),ids,why});
}
function undoLast(){
  if(posted){toast('This batch is posted. Undo is closed.');return;}
  if(postStep>=0) return;
  const u=UNDO.pop();
  if(!u){toast('Nothing to undo yet');return;}
  Object.keys(u.prev).forEach(id=>{if(u.prev[id])resolutions[id]=u.prev[id];else delete resolutions[id];});
  logA({action:'Undo',ids:u.ids,why:`Reversed: ${u.label}.`});
  if(stageMode==='review') renderReview();
  if(drawerMode==='detail'&&drawerId) openDetail(drawerId);
  toast(`Undone: ${u.label}`);
}

function wireDrop(){

  let depth=0;
  d.addEventListener('dragenter',ev=>{ev.preventDefault();depth++;d.classList.add('over');});
  d.addEventListener('dragover',ev=>{ev.preventDefault();try{ev.dataTransfer.dropEffect='copy';}catch(_){}});
  d.addEventListener('dragleave',()=>{depth=Math.max(0,depth-1);if(!depth)d.classList.remove('over');});
  d.addEventListener('drop',ev=>{
    ev.preventDefault();depth=0;d.classList.remove('over');
    const fs=ev.dataTransfer&&ev.dataTransfer.files;
    if(!fs||!fs.length){showUpErr({title:'Nothing to read',items:['Drop a .csv file from your computer, or use the sample batch.']});return;}
    handleFile(fs[0],fs.length>1);

}

function handleFile(file,many){
  if(!file) return;
  const name=file.name||'file';
  const ext=(name.includes('.')?name.split('.').pop():'').toLowerCase();
  const okType=['csv','tsv','txt'].includes(ext)||/csv|text\/plain|tab-separated/.test(file.type||'');
  if(!okType){showUpErr({title:`${name} is not a CSV file`,items:[`Expense Guard reads CSV files with a header row. ${ext?'.'+ext+' files':'This file type'} cannot be parsed.`,'Export the statement from your card provider as CSV, or run the example below.']});return;}
  if(file.size===0){showUpErr({title:`${name} is empty`,items:['Add a header row and at least one expense line.']});return;}
  if(file.size>1024*1024){showUpErr({title:`${name} is too large`,items:[`It is ${(file.size/1048576).toFixed(1)} MB. The limit is 1 MB, about 500 lines.`,'Split the export by month and upload each part.']});return;}
  const b=$('dropBusy');if(b)b.textContent=`Reading ${name}…`;
  let fr;
  try{fr=new FileReader();}catch(_){showUpErr({title:'This browser cannot read files here',items:['Paste the CSV into the example box below and run it instead.']});return;}
  fr.onload=()=>{
    const res=buildBatch(String(fr.result||''),name);
    if(res.error){showUpErr(res.error);return;}
    if(many) res.note='Only the first file was read.';
    showUpErr(null);processBatch(res);
  };
  fr.onerror=()=>showUpErr({title:`${name} could not be read`,items:['Choose it again. If it keeps failing, paste its contents into the example box below.']});
  fr.readAsText(file);
}

/* CSV parsing with quoted fields, CRLF, BOM and delimiter detection */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=(text.split(/\r?\n/).find(l=>l.trim())||'');
  const delim=[',',';','\t'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"'&&f==='') q=true;
    else if(c===delim){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);rows.push(row);row=[];f=''; }
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return {rows:rows.filter(r=>r.some(x=>x.trim()!=='')),unterminated:q,delim};
}
const HDR={
  date:['date','txndate','transactiondate','expensedate','day','posteddate'],
  employee:['employee','employeename','name','emp','submitter','submittedby','spender','cardholder'],
  category:['category','type','expensetype','expensecategory'],
  merchant:['merchant','description','vendor','payee','merchantname','details','item'],
  amount:['amount','total','amountusd','cost','value','usd'],
  account:['account','customer','customeraccount','client','sfaccount','salesforceaccount','accountname'],
  receipt:['receipt','hasreceipt','receiptattached','receipts']
};
const CAT_ALIAS={rideshare:'Rideshare',taxi:'Rideshare',uber:'Rideshare',lyft:'Rideshare',cab:'Rideshare',ride:'Rideshare',
  meals:'Meals',meal:'Meals',food:'Meals',lunch:'Meals',dinner:'Meals',breakfast:'Meals',
  hotel:'Hotel',hotels:'Hotel',lodging:'Hotel',accommodation:'Hotel',
  airfare:'Airfare',flight:'Airfare',flights:'Airfare',air:'Airfare',
  cliententertainment:'Client entertainment',entertainment:'Client entertainment'};
const normH=h=>String(h||'').toLowerCase().replace(/[^a-z]/g,'');
function normCat(s){s=String(s||'').trim();const k=normH(s);if(!k)return '';return CAT_ALIAS[k]||Object.keys(THRESH).find(c=>normH(c)===k)||(s.charAt(0).toUpperCase()+s.slice(1));}
function normEmp(s){s=String(s||'').trim().replace(/\s+/g,' ');if(!s)return '';return Object.keys(EMP_AVG).find(n=>n.toLowerCase()===s.toLowerCase())||s;}
function normAcct(s){s=String(s||'').trim().replace(/\s+/g,' ');if(!s||/^(internal|none|n\/a|na|-+)$/i.test(s))return null;return Object.keys(ACTIVITY).find(n=>n.toLowerCase()===s.toLowerCase())||s;}
function parseDate(s){
  s=String(s||'').trim();if(!s)return null;
  let m,mi,d;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))){mi=+m[2]-1;d=+m[3];}
  else if((m=s.match(/^(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?$/))){mi=+m[1]-1;d=+m[2];}
  else if((m=s.match(/^([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2})(?:,?\s+\d{4})?$/))){mi=MONTHS.findIndex(x=>x.toLowerCase()===m[1].toLowerCase());d=+m[2];}
  else if((m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?(?:\s+\d{4})?$/))){d=+m[1];mi=MONTHS.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());}
  else return null;
  if(!(mi>=0&&mi<12))return null;
  const dim=new Date(Date.UTC(2026,mi+1,0)).getUTCDate();
  if(!(d>=1&&d<=dim))return null;
  return MONTHS[mi]+' '+d;
}
function parseAmt(s){
  s=String(s||'').trim().replace(/[$€£\s]/g,'');
  if(/^\d+,\d{1,2}$/.test(s)) s=s.replace(',','.');
  s=s.replace(/,/g,'');
  if(!/^\d+(\.\d+)?$/.test(s)) return NaN;
  return Math.round(parseFloat(s)*100)/100;
}
function markDups(list,against){
  const seen={};
  (against||[]).forEach(e=>{seen[[e.emp,e.merch.toLowerCase(),e.amt,e.date].join('|')]=e.id;});
  list.forEach(e=>{const k=[e.emp,e.merch.toLowerCase(),e.amt,e.date].join('|');if(seen[k]&&!e.dup)e.dup=seen[k];else if(!seen[k])seen[k]=e.id;});
}
function buildBatch(text,name){
  if(!text||!text.trim()) return {error:{title:`${name} is empty`,items:['Add a header row and at least one expense line.']}};
  const head=text.slice(0,2000);
  if(/\u0000/.test(head)||/^%PDF/.test(head)||(head.match(/�/g)||[]).length>5) return {error:{title:`${name} is not a text file`,items:['It looks like a PDF, image or spreadsheet. Save it as CSV first.']}};
  if(/^\s*[<{\[]/.test(head)) return {error:{title:`${name} is not a CSV`,items:['It looks like HTML, XML or JSON. Expense Guard needs comma separated rows with a header line.']}};
  const P=parseCSV(text), rows=P.rows;
  if(rows.length<2) return {error:{title:'No expense lines found',items:['The file has a header row but no lines under it.']}};
  const hdr=rows[0].map(normH), idx={};
  Object.keys(HDR).forEach(f=>{idx[f]=hdr.findIndex(h=>HDR[f].includes(h));});
  const missing=['date','employee','category','merchant','amount'].filter(f=>idx[f]<0);
  if(missing.length) return {error:{title:`Missing column${missing.length>1?'s':''}: ${missing.join(', ')}`,items:[`Found: ${rows[0].map(h=>h.trim()||'(blank)').join(', ')}`,'Expected: date, employee, category, merchant, amount, plus optional account and receipt.']}};
  if(rows.length-1>500) return {error:{title:'Too many lines',items:[`The file has ${rows.length-1} lines. The limit is 500.`]}};
  const out=[],skipped=[];
  rows.slice(1).forEach((r,i)=>{
    const line=i+2, get=f=>idx[f]>=0?String(r[idx[f]]==null?'':r[idx[f]]).trim():'';
    const date=parseDate(get('date'));
    if(!date){skipped.push(`Line ${line}: "${get('date')||'blank'}" is not a date.`);return;}
    const amt=parseAmt(get('amount'));
    if(!(amt>0)){skipped.push(`Line ${line}: amount "${get('amount')||'blank'}" is not a positive number.`);return;}
    const emp=normEmp(get('employee'));
    if(!emp){skipped.push(`Line ${line}: employee is blank.`);return;}
    const merch=get('merchant');
    if(!merch){skipped.push(`Line ${line}: merchant is blank.`);return;}
    const cat=normCat(get('category'));
    if(!cat){skipped.push(`Line ${line}: category is blank.`);return;}
    const rc=get('receipt');
    out.push({id:`E-${2001+out.length}`,emp,cat,merch:merch.slice(0,120),amt,date,acct:normAcct(get('account')),rcpt:rc===''?true:!/^(no|n|false|0|missing|none)$/i.test(rc)});
  });
  if(P.unterminated) skipped.push('The last quoted field was never closed, so the final line may be cut short.');
  if(!out.length) return {error:{title:'No valid expense lines',items:skipped.slice(0,6).concat(skipped.length>6?[`and ${skipped.length-6} more`]:[])}};
  markDups(out);
  return {rows:out,skipped,name};
}

  stageMode='proc';$('newBatchBtn').style.display='none';
  const steps=[`Parsing ${EXPENSES.length} line item${EXPENSES.length===1?'':'s'}`,'Matching to employees & cards', synced?'Cross-checking Salesforce activity':'Skipping CRM cross-check','Applying Finance policy thresholds','AI review & flagging'];

  $('vp').scrollTop=0;
  let i=0;

    if(tok!==procToken) return;
    if(i>0){const p=$('ps'+(i-1));p.classList.remove('on');p.classList.add('done');p.querySelector('.d').innerHTML=check2();}
    if(i>=steps.length){setTimeout(()=>{if(tok!==procToken)return;logBatchAI();fadeNext=true;renderReview();},400);return;}
    $('ps'+i).classList.add('on');i++;setTimeout(run,560);
  };
  setTimeout(run,420);
}

function postSteps(){

}
function renderDone(){const el=$('doneCard');if(el)el.innerHTML=doneHTML();}
function postBatch(){
  if(posted||postStep>=0)return;
  if(!EXPENSES.every(e=>resolutions[e.id])){toast('Decide every expense first');return;}
  postStep=0;renderDone();
  const n=postSteps().length;
  const tick=()=>{
    postStep++;
    if(postStep>=n){
      posted=true;postStep=-1;
      const apIds=EXPENSES.filter(e=>resolutions[e.id]==='approved').map(e=>e.id), rjIds=EXPENSES.filter(e=>resolutions[e.id]==='rejected').map(e=>e.id);

      fadeNext=false;renderReview();toast('Posted to Salesforce');return;
    }
    renderDone();setTimeout(tick,RM?150:600);
  };
  setTimeout(tick,RM?150:600);
}

function visibleIds(){return EXPENSES.filter(e=>passFilter(e,evaluate(e))).map(e=>e.id);}
function markSel(){document.querySelectorAll('.trow').forEach(r=>r.classList.toggle('sel',r.dataset.id===selId));}
function selectRow(id){

  if(el)el.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});

function move(d){
  if(view!=='expenses'){view='expenses';renderReview();}
  const ids=visibleIds();if(!ids.length)return;
  const cur=drawerMode==='detail'&&drawerId?drawerId:selId;
  let i=ids.indexOf(cur);
  i=i<0?(d>0?0:ids.length-1):Math.min(ids.length-1,Math.max(0,i+d));

function kbDecide(r){
  const id=drawerMode==='detail'&&drawerId?drawerId:selId;
  if(!id){toast('Press J to select an expense first');return;}
  if(!canDecide())return;
  const e=EXPENSES.find(x=>x.id===id);if(!e)return;
  if(resolutions[id]===r){toast(`${id} is already ${r}`);return;}
  const ids=visibleIds(), i=ids.indexOf(id), wasOpen=drawerMode==='detail'&&!!drawerId;
  decide([id],r,`${r==='approved'?'approved':'rejected'} ${id}`,defaultWhy(e,r));
  renderReview();
  const nids=visibleIds();
  let next=ids.slice(i+1).find(x=>nids.includes(x));
  if(!next&&nids.length)next=nids.filter(x=>x!==id).slice(-1)[0]||null;
  if(next){selectRow(next);if(wasOpen)openDetail(next);}

document.addEventListener('keydown',ev=>{
  const t=ev.target;
  const typing=t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"]');
  if(ev.key==='Escape'){
    if(modalOpen){closeModal();ev.preventDefault();return;}
    if(typing){t.blur();return;}
    if($('drawer').classList.contains('on')){closeDrawer();ev.preventDefault();}
    return;
  }
  if(typing||modalOpen)return;
  if((ev.metaKey||ev.ctrlKey)&&!ev.altKey&&ev.key.toLowerCase()==='z'&&stageMode==='review'){ev.preventDefault();undoLast();return;}
  if(ev.metaKey||ev.ctrlKey||ev.altKey)return;
  if(stageMode!=='review')return;
  const k=ev.key.length===1?ev.key.toLowerCase():ev.key.toLowerCase();
  if((k==='enter'||k===' ')&&t&&t.closest&&t.closest('button,a,summary,[role="button"]')){
    if(t.classList.contains('chip')){t.click();ev.preventDefault();}
    return;
  }
  if(k==='enter'&&t&&t.classList&&t.classList.contains('trow')){openDetail(t.dataset.id);ev.preventDefault();return;}
  if(ev.key==='?'){showKeys();ev.preventDefault();return;}
  if(drawerMode==='form'&&$('drawer').classList.contains('on'))return;
  switch(k){
    case 'j':move(1);break;
    case 'k':move(-1);break;
    case 'a':if(view!=='expenses')return;kbDecide('approved');break;
    case 'r':if(view!=='expenses')return;kbDecide('rejected');break;
    case 'u':undoLast();break;
    case 'enter':case 'o':if(selId&&!drawerId)openDetail(selId);else return;break;
    default:return;
  }
  ev.preventDefault();
});

      <label class="fld">Subject<input class="inp" id="cSubj" value="${esc(composeSubj)}" oninput="composeSubj=this.value"></label>
      <label class="fld">Message<textarea class="inp" id="cMsg" oninput="composeDraft=this.value;syncSend()">${esc(composeDraft)}</textarea></label>
      <div class="compose__f"><button class="btn btn--lime btn--sm" id="cSend" onclick="sendAsk('${e.id}')">Send</button><button class="btn btn--ghost btn--sm" onclick="cancelCompose()">Cancel</button><span class="why" id="cWhy"></span></div>
    </div>`:'';
  $('drawer').innerHTML=`
    <div class="drawer__h">
      <div style="min-width:0"><div class="eyebrow">${e.id} · ${esc(e.cat)}</div><div class="drawer__t">${esc(e.merch)}</div></div>
      <div class="drawer__nav">
        <button class="drawer__x" onclick="move(-1)" aria-label="Previous expense" title="Previous (K)" ${idx<=0?'disabled':''}>‹</button>
        <button class="drawer__x" onclick="move(1)" aria-label="Next expense" title="Next (J)" ${idx<0||idx>=ids.length-1?'disabled':''}>›</button>
        <button class="drawer__x" onclick="closeDrawer()" aria-label="Close">×</button>
      </div>
    </div>
    <div class="drawer__b">
      <div class="bigamt num">${money(e.amt)}</div>
      <div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><span class="status ${v.cls}">${dotFor(v.key)} ${v.label}</span>${resolved?`<span class="faint small">AI said: ${a.label}</span>`:''}${ask?(ask.reply?'<span class="mini mini--t">Replied</span>':'<span class="mini">Asked</span>'):''}</div>
      <div class="verdict" style="border-color:${v.flag?v.color:'var(--line2)'};background:${v.flag?'color-mix(in srgb,'+v.color+' 9%,transparent)':'var(--panel2)'}">
        <div class="verdict__h" style="color:${v.color}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9z" fill="currentColor"/></svg> AI assessment</div>
        <div class="vs">${resolved?'<span class="lbl">AI recommended. </span>':''}${esc(verdictLine(e,a))}</div>
        <div class="conf"><span>Confidence <b class="num">${c.p}%</b></span><span class="conf__bar"><i style="width:${c.p}%"></i></span></div>
        <div class="conf__why">${esc(c.why)}</div>
        <ul>${v.reasons.map(r=>`<li>${r}</li>`).join('')}</ul>
      </div>
      <div class="kv"><span class="k">Employee</span><span>${esc(e.emp)}</span></div>
      <div class="kv"><span class="k">Date</span><span class="num">${e.date}</span></div>
      <div class="kv"><span class="k">Account</span><span>${e.acct?esc(e.acct):'— internal —'}</span></div>
      <div class="kv"><span class="k">Category cap</span><span class="num">${THRESH[e.cat]!=null?money0(THRESH[e.cat]):'—'}</span></div>
      <div class="kv"><span class="k">Receipt</span><span>${e.rcpt?'Attached':'<span style="color:var(--amber)">Missing</span>'}</span></div>
      ${meterHTML(e,a)}
      ${timeline}
      ${spendHTML(e)}
      <details class="agent agent--d" ${agentOpenD?'open':''} ontoggle="agentOpenD=this.open">
        <summary><span class="agent__ic">${SPARK}</span><b>Agent activity</b><span class="muted small">${agentTrace(e).length} checks on ${e.id}</span><span class="caret">›</span></summary>
        ${callsHTML(agentTrace(e),e.id)}
      </details>
      ${thread}
      ${compose}
      ${!resolved&&!posted?`<label class="fld note">Decision note <span class="faint" style="font-weight:500">Optional. Saved to the audit log with your decision.</span><input class="inp" id="noteIn" value="${esc(NOTES[e.id]||'')}" oninput="NOTES['${e.id}']=this.value" placeholder="e.g. Manager confirmed the client dinner"></label>`:''}
    </div>
    <div class="drawer__f">
      ${posted?`<div class="muted" style="align-self:center;font-size:13px">Posted to Salesforce as <b style="color:${resolved==='approved'?'var(--green)':'var(--rose)'}">${resolved}</b>. Start again to review a new batch.</div>`
      :resolved?`<div class="muted" style="align-self:center;font-size:13px">Resolved: <b style="color:${resolved==='approved'?'var(--green)':'var(--rose)'}">${resolved}</b></div><button class="btn btn--ghost btn--sm" onclick="resolve('${e.id}',null)">Undo</button>`
      :`<button class="btn btn--green btn--sm" onclick="resolve('${e.id}','approved')">Approve</button>
        <button class="btn btn--ghost btn--sm" onclick="openCompose('${e.id}')">${ask?'Ask again':'Ask the employee'}</button>
        <button class="btn btn--rose btn--sm" onclick="resolve('${e.id}','rejected')">Reject</button>
        <span class="drawer__keys"><span class="kbd">A</span><span class="kbd">R</span><span class="kbd">J</span><span class="kbd">K</span></span>`}
    </div>`;
  const nb=$('drawer').querySelector('.drawer__b');if(nb)nb.scrollTop=st;
  $('drawer').classList.add('on');$('scrim').classList.add('on');
  if(composeFor===id)syncSend();
}
function closeDrawer(){$('drawer').classList.remove('on');$('scrim').classList.remove('on');drawerId=null;drawerMode=null;composeFor=null;}
function resolve(id,r){
  if(!canDecide())return;
  const e=EXPENSES.find(x=>x.id===id);if(!e)return;
  decide([id],r,r?`${r} ${id}`:`reopen ${id}`,r?defaultWhy(e,r):`Decision on ${id} reopened from the expense drawer.`);
  closeDrawer(); renderReview();
  if(r) toast(`Expense ${id} ${r}`,'Undo',undoLast); else toast('Resolution undone');
}

/* ask the employee */
function openCompose(id){
  const e=EXPENSES.find(x=>x.id===id);if(!e)return;
  const a=assess(e);
  composeFor=id;composeDraft=draftMessage(e);composeSubj=`Expense ${id}: ${a.flag?a.label.toLowerCase():'quick check'}`;
  openDetail(id);
  const c=$('compose');if(c){c.scrollIntoView({block:'nearest',behavior:RM?'auto':'smooth'});const t=$('cMsg');if(t)setTimeout(()=>{try{t.focus({preventScroll:true});}catch(_){t.focus();}},60);}
}
function syncSend(){
  const b=$('cSend'),w=$('cWhy');if(!b)return;
  const empty=!composeDraft.trim();
  b.disabled=empty;if(w)w.textContent=empty?'Write a message to send':'';
}
function cancelCompose(){const id=composeFor;composeFor=null;if(id)openDetail(id);}
function sendAsk(id){
  const e=EXPENSES.find(x=>x.id===id);if(!e)return;
  const msg=composeDraft.trim();if(!msg){syncSend();return;}
  const tok=procToken;
  ASKED[id]={ts:new Date(),msg,subj:composeSubj};
  logA({action:'Asked employee',ids:[id],why:`Sent to ${e.emp}: "${composeSubj}". ${msg.split('\n').filter(l=>l.trim()).slice(1,2).join(' ')}`});
  composeFor=null;
  openDetail(id);renderRows();
  toast(`Justification requested from ${e.emp}`);
  setTimeout(()=>{
    if(tok!==procToken||!ASKED[id]||ASKED[id].reply)return;
    const text=cannedReply(e);
    ASKED[id].reply={ts:new Date(),text};
    logA({who:e.emp,kind:'emp',action:'Employee replied',ids:[id],why:text});
    if(stageMode==='review'){ if(view==='audit')renderReview(); else renderRows(); }
    if(drawerMode==='detail'&&drawerId===id&&composeFor!==id)openDetail(id);
    toast(`${e.emp} replied on ${id}`);
  },RM?1200:2600);
}

/* ---------- ADD AN EXPENSE ---------- */
let FORM={emp:'Mara Lin',cat:'Meals',merch:'',amt:'',date:'2026-03-24',acct:'Atlas Lyon',rcpt:true};
function nextId(){const n=EXPENSES.reduce((m,e)=>Math.max(m,parseInt(String(e.id).replace(/\D/g,''),10)||0),1000);return 'E-'+(n+1);}
function formExpense(){
  const emp=normEmp(FORM.emp), merch=String(FORM.merch||'').trim(), amt=parseAmt(FORM.amt), date=parseDate(FORM.date);
  const why=!emp?'Enter an employee':!merch?'Enter a merchant':!(amt>0)?'Enter an amount above $0':!date?'Pick a date':'';
  if(why)return {why};
  const e={id:nextId(),emp,cat:FORM.cat,merch:merch.slice(0,120),amt,date,acct:normAcct(FORM.acct),rcpt:!!FORM.rcpt};
  markDups([e],EXPENSES);
  return {e};
}
function openAddForm(){
  if(posted){toast('This batch is posted. Start again to add expenses.');return;}
  drawerMode='form';drawerId=null;composeFor=null;
  const empNames=[...new Set(Object.keys(EMP_AVG).concat(EXPENSES.map(e=>e.emp)))];
  const accts=[...new Set(Object.keys(ACTIVITY).concat(EXPENSES.filter(e=>e.acct).map(e=>e.acct)))];
  $('drawer').innerHTML=`
    <div class="drawer__h">
      <div style="min-width:0"><div class="eyebrow">New expense · ${esc(BATCH.label)}</div><div class="drawer__t">Add an expense</div></div>
      <div class="drawer__nav"><button class="drawer__x" onclick="closeDrawer()" aria-label="Close">×</button></div>
    </div>
    <div class="drawer__b">
      <p class="muted small" style="margin:0 0 16px">Checked by the same rules as the batch: the category cap, CRM activity at the account on the day, and the employee's six-month average.</p>
      <form id="addForm" onsubmit="event.preventDefault();addExpense()" novalidate>
        <div class="fgrid">
          <label class="fld">Employee<input class="inp" name="emp" list="empList" value="${esc(FORM.emp)}" autocomplete="off" oninput="formChanged()"></label>
          <label class="fld">Category<select class="inp" name="cat" onchange="formChanged()">${Object.keys(THRESH).map(c=>`<option ${c===FORM.cat?'selected':''}>${c}</option>`).join('')}</select></label>
          <label class="fld wide">Merchant and purpose<input class="inp" name="merch" value="${esc(FORM.merch)}" placeholder="Bistro Paul (client lunch, 2)" autocomplete="off" oninput="formChanged()"></label>
          <label class="fld">Amount (USD)<input class="inp num" name="amt" type="number" inputmode="decimal" min="0" step="0.01" value="${esc(FORM.amt)}" placeholder="0.00" oninput="formChanged()"></label>
          <label class="fld">Date<input class="inp" name="date" type="date" min="2026-01-01" max="2026-12-31" value="${esc(FORM.date)}" oninput="formChanged()"></label>
          <label class="fld wide">Customer account <span class="faint" style="font-weight:500">Leave blank for an internal expense</span><input class="inp" name="acct" list="acctList" value="${esc(FORM.acct)}" autocomplete="off" oninput="formChanged()"></label>
          <label class="fld wide fcheck"><input type="checkbox" name="rcpt" ${FORM.rcpt?'checked':''} onchange="formChanged()"> Receipt attached</label>
        </div>
        <datalist id="empList">${empNames.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
        <datalist id="acctList">${accts.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
        <div id="precheck"></div>
      </form>
    </div>
    <div class="drawer__f">
      <button class="btn btn--lime btn--sm" id="addBtn" onclick="addExpense()">Add to batch</button>
      <button class="btn btn--ghost btn--sm" onclick="closeDrawer()">Cancel</button>
      <span class="why" id="addWhy"></span>
    </div>`;
  $('drawer').classList.add('on');$('scrim').classList.add('on');
  formChanged();
  setTimeout(()=>{const m=document.querySelector('#addForm [name=merch]');if(m&&!(window.matchMedia&&matchMedia('(hover:none)').matches))m.focus();},RM?0:300);
}
function formChanged(){
  const f=$('addForm');if(!f)return;
  FORM={emp:f.emp.value,cat:f.cat.value,merch:f.merch.value,amt:f.amt.value,date:f.date.value,acct:f.acct.value,rcpt:f.rcpt.checked};
  const r=formExpense(), b=$('addBtn'), w=$('addWhy'), pc=$('precheck');
  b.disabled=!!r.why; w.textContent=r.why||'';
  if(r.why){pc.innerHTML=`<div class="pre"><div class="pre__h"><span class="agent__ic">${SPARK}</span><b>AI pre-check</b></div><div class="muted small">Runs as you type. ${esc(r.why)} to see the verdict.</div></div>`;return;}
  const e=r.e, a=assess(e), c=confidence(e,a), m=memFor(e.emp,e.amt);
  const G=(k,t)=>`<div><span class="g" style="color:${k==='ok'?'var(--green)':k==='skip'?'var(--faint)':k==='fail'?'var(--rose)':'var(--amber)'}">${GLYPH[k]}</span><span>${t}</span></div>`;
  const rows=[
    a.cap!=null?G(a.over?'warn':'ok',a.over?`${money(e.amt)} is ${money(e.amt-a.cap)} over the ${money0(a.cap)} ${esc(e.cat)} cap.`:`${money(e.amt)} is within the ${money0(a.cap)} ${esc(e.cat)} cap.`):G('warn',`No cap is set for ${esc(e.cat)}.`),
    !e.acct?G('ok','Internal expense. No CRM check needed.'):!synced?G('skip','CRM cross-check is off for this batch.'):a.noAct?G('fail',a.near?`No ${esc(e.acct)} activity ${WIN?'within a day of':'on'} ${e.date}. Nearest: ${a.near.d}.`:`Salesforce has no activity for ${esc(e.acct)}.`):G('ok',`Matches ${esc(e.acct)} activity on ${a.near.d}.`),
    m.nohist?G('skip',`No six-month history for ${esc(e.emp)} yet.`):G(m.flag?'warn':'ok',`${esc(e.emp)} would be at ${money0(m.total)}, ${m.deltaPct>=0?'+':''}${m.deltaPct}% vs the ${money0(m.avg)} six-month average.`),
    e.dup?G('warn',`Looks like a duplicate of ${e.dup}.`):G('ok','No duplicate found.'),
    e.rcpt?G('ok','Receipt attached.'):G('warn','No receipt.')
  ];
  pc.innerHTML=`<div class="pre"><div class="pre__h"><span class="agent__ic">${SPARK}</span><b>AI pre-check</b><span class="status ${a.cls}" style="margin-left:auto">${dotFor(a.key)} ${a.label}</span></div>
    <div class="vs" style="font-size:13px">${esc(verdictLine(e,a))}</div>
    <div class="conf"><span>Confidence <b class="num">${c.p}%</b></span><span class="conf__bar"><i style="width:${c.p}%"></i></span></div>
    <div class="pre__rows">${rows.join('')}</div></div>`;
}
function addExpense(){
  if(posted){toast('This batch is posted. Start again to add expenses.');return;}
  const r=formExpense();if(r.why){toast(r.why);return;}
  const e=r.e;EXPENSES.push(e);
  const a=assess(e), c=confidence(e,a);
  logA({action:'Added expense',ids:[e.id],why:`Entered by hand. AI verdict: ${a.label} (${c.p}% confidence). ${verdictLine(e,a)}`});
  FORM.merch='';FORM.amt='';
  filter='all';view='expenses';renderReview();
  openDetail(e.id);selectRow(e.id);
  toast(`${e.id} added. AI verdict: ${a.label}`);
}

/* boot */
logBatchAI(new Date(Date.now()-3*60*1000));
renderReview();
</script>
</body>
</html>
