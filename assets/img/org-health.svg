<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Geist Mono','Inter',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131b"/><stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2c879"/><stop offset="1" stop-color="#f2778c"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3dc6ce"/><stop offset="1" stop-color="#d9f77b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#d9f77b" stop-opacity="0.10"/><stop offset="1" stop-color="#d9f77b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- faint grid -->
  <g stroke="#1b2130" stroke-width="1">
    <path d="M0 225H1600M0 450H1600M0 675H1600"/>
    <path d="M400 0V900M800 0V900M1200 0V900"/>
  </g>

  <!-- header -->
  <g transform="translate(90,110)">
    <rect x="0" y="-34" width="46" height="46" rx="13" fill="#d9f77b"/>
    <path d="M23 -26 L38 -19 V-8 C38 3 30 8 23 11 C16 8 8 3 8 -8 V-19 Z" fill="none" stroke="#0a0a0a" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M17 -9 l4 4 l8 -8" fill="none" stroke="#0a0a0a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="64" y="-8" fill="#eef1f6" font-size="30" font-weight="700">ORG HEALTH AUDITOR</text>
    <text x="64" y="20" fill="#8a93a6" font-size="19" letter-spacing="2">POST-CONSOLIDATION AUDIT · NORTHBRAND GROUP</text>
  </g>

  <!-- big stat -->
  <g transform="translate(90,300)">
    <text x="0" y="0" fill="#eef1f6" font-size="130" font-weight="800" letter-spacing="-4">202</text>
    <text x="330" y="-58" fill="#8a93a6" font-size="24">automations</text>
    <text x="330" y="-24" fill="#8a93a6" font-size="24">mapped</text>
    <g transform="translate(330,-6)">
      <rect x="0" y="0" width="230" height="42" rx="21" fill="rgba(242,200,121,0.13)" stroke="#f2c879" stroke-opacity="0.4"/>
      <text x="24" y="28" fill="#f2c879" font-size="22" font-weight="700">31 orphaned · 15%</text>
    </g>
  </g>

  <!-- object heat bars -->
  <g transform="translate(90,410)" font-size="21">
    <text x="0" y="0" fill="#5d6577" font-size="17" letter-spacing="2">OBJECT HEAT — AUTOMATION DENSITY</text>
    <!-- rows -->
    <g transform="translate(0,34)">
      <text x="0" y="26" fill="#c7cdda">Opportunity</text><rect x="210" y="8" width="700" height="26" rx="7" fill="#1b2130"/><rect x="210" y="8" width="700" height="26" rx="7" fill="url(#hot)"/><text x="930" y="28" fill="#f2778c" font-weight="700">34</text>
    </g>
    <g transform="translate(0,80)">
      <text x="0" y="26" fill="#c7cdda">Account</text><rect x="210" y="8" width="596" height="26" rx="7" fill="#1b2130"/><rect x="210" y="8" width="596" height="26" rx="7" fill="url(#hot)"/><text x="826" y="28" fill="#f2c879" font-weight="700">29</text>
    </g>
    <g transform="translate(0,126)">
      <text x="0" y="26" fill="#c7cdda">Contact</text><rect x="210" y="8" width="494" height="26" rx="7" fill="#1b2130"/><rect x="210" y="8" width="494" height="26" rx="7" fill="url(#hot)"/><text x="724" y="28" fill="#f2c879" font-weight="700">24</text>
    </g>
    <g transform="translate(0,172)">
      <text x="0" y="26" fill="#c7cdda">Case</text><rect x="210" y="8" width="350" height="26" rx="7" fill="#1b2130"/><rect x="210" y="8" width="350" height="26" rx="7" fill="url(#cool)"/><text x="580" y="28" fill="#8a93a6" font-weight="700">17</text>
    </g>
    <g transform="translate(0,218)">
      <text x="0" y="26" fill="#c7cdda">Lead</text><rect x="210" y="8" width="308" height="26" rx="7" fill="#1b2130"/><rect x="210" y="8" width="308" height="26" rx="7" fill="url(#cool)"/><text x="538" y="28" fill="#8a93a6" font-weight="700">15</text>
    </g>
  </g>

  <!-- conflict card (right) -->
  <g transform="translate(1030,150)">
    <rect x="0" y="0" width="480" height="300" rx="18" fill="#13161f" stroke="rgba(242,119,140,0.4)"/>
    <text x="26" y="46" fill="#f2778c" font-size="20" font-weight="700">⚠ EXECUTION-ORDER CONFLICT</text>
    <rect x="26" y="66" width="330" height="40" rx="9" fill="#191d29" stroke="#333a4d"/>
    <text x="44" y="92" fill="#eef1f6" font-size="19">Opportunity.Net_ARR__c</text>
    <!-- writer 1 -->
    <g transform="translate(26,128)">
      <rect x="0" y="0" width="70" height="30" rx="7" fill="rgba(61,198,206,0.15)"/><text x="14" y="21" fill="#3dc6ce" font-size="17" font-weight="700">Flow</text>
      <text x="86" y="21" fill="#c7cdda" font-size="18">writes Net_ARR__c</text>
    </g>
    <!-- writer 2 -->
    <g transform="translate(26,172)">
      <rect x="0" y="0" width="82" height="30" rx="7" fill="rgba(217,247,123,0.15)"/><text x="12" y="21" fill="#d9f77b" font-size="17" font-weight="700">Apex</text>
      <text x="98" y="21" fill="#c7cdda" font-size="18">writes Net_ARR__c</text>
    </g>
    <line x1="26" y1="220" x2="454" y2="220" stroke="#272d3c"/>
    <text x="26" y="252" fill="#f2778c" font-size="18" font-weight="700">Nondeterministic value</text>
    <text x="26" y="278" fill="#8a93a6" font-size="16">order not guaranteed across releases</text>
  </g>

  <!-- remediation chip (right lower) -->
  <g transform="translate(1030,500)">
    <rect x="0" y="0" width="480" height="300" rx="18" fill="#13161f" stroke="#272d3c"/>
    <text x="26" y="44" fill="#5d6577" font-size="17" letter-spacing="2">REMEDIATION PLAN</text>
    <g font-size="18" fill="#c7cdda">
      <g transform="translate(26,66)">
        <circle cx="16" cy="16" r="16" fill="#d9f77b"/><text x="16" y="22" fill="#0a0a0a" font-size="18" font-weight="800" text-anchor="middle">1</text>
        <text x="46" y="22" fill="#eef1f6">Retire 31 dead automations</text>
        <rect x="360" y="4" width="60" height="26" rx="6" fill="rgba(91,208,138,0.13)"/><text x="372" y="22" fill="#5bd08a" font-size="15" font-weight="700">S · low</text>
      </g>
      <g transform="translate(26,120)">
        <circle cx="16" cy="16" r="16" fill="#d9f77b"/><text x="16" y="22" fill="#0a0a0a" font-size="18" font-weight="800" text-anchor="middle">2</text>
        <text x="46" y="22" fill="#eef1f6">Fix Net_ARR__c conflict</text>
        <rect x="330" y="4" width="90" height="26" rx="6" fill="rgba(242,119,140,0.13)"/><text x="342" y="22" fill="#f2778c" font-size="15" font-weight="700">M · high</text>
      </g>
      <g transform="translate(26,174)">
        <circle cx="16" cy="16" r="16" fill="#d9f77b"/><text x="16" y="22" fill="#0a0a0a" font-size="18" font-weight="800" text-anchor="middle">3</text>
        <text x="46" y="22" fill="#eef1f6">Consolidate Opp workflow rules</text>
        <rect x="360" y="4" width="60" height="26" rx="6" fill="rgba(242,200,121,0.13)"/><text x="372" y="22" fill="#f2c879" font-size="15" font-weight="700">L · med</text>
      </g>
      <text x="46" y="248" fill="#5d6577" font-size="16">…dependency-ordered · 6 steps</text>
    </g>
  </g>
</svg>
